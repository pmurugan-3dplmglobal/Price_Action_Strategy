- id: ISSUE-054
  title: UTC Cloud System Clock Mismatch Suppressing Stop Loss Evaluations on Remote VMs
  severity: CRITICAL
  category: Timezone & Position Monitoring
  family: EXECUTION_GUARD
  date_reported: '2026-09-03'
  symptom: 'Active positions on Oracle Cloud VM (e.g. FINNIFTY, BANKBARODA, SENSEX) that breached their Stop Loss levels failed to execute automated stop-loss exits during morning and afternoon trading sessions.'
  root_cause: 'On cloud Linux VMs configured with UTC system timezone, dt.now().strftime("%H:%M") and dt.now().time() evaluated to UTC time (e.g., 04:25 UTC when IST is 09:55 AM). Because the morning volatility guard checked now_time_str < "09:45", the condition evaluated to True throughout the entire Indian market trading hours (03:45 UTC to 09:45 UTC / 09:15 to 15:15 IST), causing the system to bypass Candle Close SL, Emergency Hard SL, Tick LTP SL, and Hard Max Loss checks until market close.'
  affected_files:
  - common/position_monitor.py
  - Trade_Option/app_option_Trade.py
  - Trade_Stock/app_Stock_Trade.py
  - common/websocket_monitor.py
  - Trade_Option/automated_strategy_exporter.py
  - MASTER_DOCUMENTATION.yaml
  - ISSUE_MANAGEMENT.yaml
  resolution: '1. Replaced all system-local dt.now().strftime("%H:%M") and dt.now().time() calls in SL evaluations and failsafe monitors with IST-normalized get_ist_now().strftime("%H:%M") and get_ist_now().time().
    2. Verified on Poovendan Oracle Cloud VM (140.245.197.71) that SL evaluations correctly trigger at 09:45 AM IST.
    3. Deployed and verified 100% test pass on regression suite.'
  status: RESOLVED
