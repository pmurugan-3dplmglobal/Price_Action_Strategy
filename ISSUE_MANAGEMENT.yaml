- id: ISSUE-081
  title: Fix Scan Tab Trade Scarcity, Token Resolution, and Timeframe Candle Time Alignment
  severity: HIGH
  category: Scanner Discovery, Registry Resolution & UI Data Presentation
  family: SCANNER_DISCOVERY
  date_reported: '2026-09-03'
  symptom: '1. Scan Tab displayed very few or zero trades when running stock reversal scans.
    2. Scanner crashed mid-scan with TypeError: ''>'' not supported between instances of ''NoneType'' and ''int'' when evaluating check_portfolio_risk_caps on existing trades with lot_size=None.
    3. Option contract tokens from NFO cache polluted STOCK_REGISTRY for non-Nifty50 symbols (Midcap/Smallcap), causing cash equity scanners to fetch option candles with distorted prices and low option volumes.
    4. is_liquid_cash_stock rejected 100% of stocks on intraday timeframes (15m, 30m, 1hr) and high-value equities (DIXON, OFSS) on daily charts due to unscaled volume and turnover thresholds.
    5. Raw string comparison between candle_a_time and swing_meta["terminal_date"] erroneously discarded valid Anchor A setups that formed on the exact same date as the terminal swing base.
    6. stock_reversal_scanner.py assigned Anchor A time to both entry_time and candle_a_time, discarding actual Point D entry breakout times.
    7. formatTimestamp in UI dashboards forcibly returned "09:15" for daily/weekly candles (00:00:00) instead of displaying the actual date/candle time of the timeframe set while scanning.
    '
  root_cause: 'Token pollution in _populate_stock_registry_from_cache, static daily volume filters applied to intraday bars, un-normalized string date comparisons in terminal swing filters, variable mixup between Point A and Point D in scanner display formatting, and hardcoded 09:15 override in UI formatTimestamp.
    '
