- id: FEATURE-020
  title: Zero-Trade Diagnostic Fixes — Dynamic Token Sync, 45-Bar Base Recency & 5-Bar Sequence Tolerance
  severity: ENHANCEMENT
  category: Scanner Quality & Signal Throughput
  family: SIGNAL_EXPANSION
  date_reported: '2026-08-25'
  symptom: '1. 8 liquid Nifty 50 stocks (LTIM, TATAMOTORS, TECHM, BAJAJFINSV, etc.) failed due to stale or missing registry
    tokens.

    2. High-quality extended accumulation setups (e.g. EICHERMOT 26 bars) were dropped by an arbitrary 20-bar recency cap.

    3. Textbook anchors forming at the exact bottom tick were rejected because the parabolic swing detector confirmed base
    1-3 bars later.

    '
  root_cause: '1. Static STOCK_REGISTRY entries lacked auto-sync normalization for hyphenated symbols and missing tickers
    (LTIM, TATAMOTORS).

    2. max_bars_after_terminal was rigidly capped at 20 bars.

    3. Strict timestamp equality Anchor_Time >= Terminal_Base_Time rejected valid contemporaneous bottom anchors.

    '
  affected_files:
  - common/registries.py
  - common/swing_detection.py
  - common/patterns_bull.py
  - common/patterns_bear.py
  - MASTER_DOCUMENTATION.yaml
  resolution: '1. Added LTIM, TATAMOTORS, BAJAJ-AUTO token mapping and enhanced sync_stock_tokens with flexible symbol normalization.

    2. Extended max_bars_after_terminal from 20 to 45 bars in detect_parabolic_multi_swings.

    3. Implemented a 5-bar lookback window in the sequence gatekeeper (Anchor_idx >= Terminal_idx - 5) in both bull and bear
    pattern modules.

    4. Verified across regression test suite with 100% pass rate.

    '
  status: COMPLETED
- id: FEATURE-019
  title: 3-Swing Downward Break of Structure (BOS) Cascade & Terminal Base Reversal Validation
  severity: ENHANCEMENT
  category: Market Structure & Pattern Recognition
  family: SWING_DETECTION
  date_reported: '2026-08-25'
  symptom: 'Wick-only dips could occasionally register as lower pivots without genuine body close acceptance,

    diluting Tier 1 Gold classification purity during choppy consolidation periods.

    '
  root_cause: 'validate_parabolic_cascade_structure verified monotonic pivot values but lacked strict candle-close

    Break of Structure (BOS) validation across intermediate cascading waves.

    '
  affected_files:
  - common/swing_detection.py
  - MASTER_DOCUMENTATION.yaml
  resolution: '1. Implemented strict candle-close Break of Structure (has_bos) for each wave in validate_parabolic_cascade_structure.

    2. Enforced that each subsequent downward wave leg must have a confirmed candle close below the prior structural low (start_val).

    3. Tier 1 Gold now strictly requires >= 3 cascading arches + progressive lower highs + confirmed BOS on all waves + terminal
    3rd swing base bottom.

    4. Verified via full regression test suite (Test 13 AST and math tests passed).

    '
  status: COMPLETED
- id: FEATURE-018
  title: Friday 15:15 EOD Index Squareoff, Expiry Rollover Protection & Outlier Entry Price Guard
  severity: ENHANCEMENT
  category: Risk Management & Order Execution
  family: RISK_MANAGEMENT
  date_reported: '2026-08-25'
  symptom: '1. Short-timeframe (3m) index options carried over weekend suffered 30%+ theta crush and opening gap decay on
    Monday.

    2. Trading stock options in the final 5 days before monthly expiry resulted in extreme theta decay.

    3. Stale manual/user override prices (e.g. entry 12.0 on 0.60 market LTP) triggered instant false Emergency Hard SL hits.

    '
  root_cause: '1. Missing Friday EOD auto-squareoff rule for short-timeframe and index contracts.

    2. Option strike resolution used a tight 4-day threshold, missing early weekly rollover into next-month stock contracts.

    3. Position monitor lacked outlier divergence checking between entry_spot and live LTP on user-edited entries.

    '
  affected_files:
  - common/position_monitor.py
  - common/resolve.py
  - common/trading_core.py
  - Trade_Option/app_option_Trade.py
  - Trade_Stock/app_Stock_Trade.py
  resolution: '1. Added Friday 15:15 IST auto-squareoff guard in common/position_monitor.py for 3m/5m index options to eliminate
    weekend holding risk.

    2. Enhanced resolve_option_strikes in common/resolve.py and trading_core.py with next-month series rollover for stock
    options during monthly expiry week (days_rem <= 6), while keeping near-week active expiry for index options.

    3. Implemented Stale/Outlier Entry Price Guard in position_monitor.py and 1-click buy endpoints to align divergent entry
    prices with live LTP.

    4. Verified via full regression suite and AST checks.

    '
  status: COMPLETED
