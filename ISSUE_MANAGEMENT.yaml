- id: POLICY-001
  title: Datta & Minervini Law - Risk Discipline, Outcome Bias Immunity & Objective D2 Re-Entry Mandate
  severity: ARCHITECTURAL
  category: Strategy & Risk Psychology Invariants
  family: DOMAIN_INVARIANTS
  date_reported: '2026-09-05'
  symptom: 'Traders suffering from outcome bias after taking a disciplined stop-loss when an asset eventually rallies days later, leading to either premature revenge trading or emotional paralysis that causes missing high-probability D2 re-entries.'
  root_cause: 'Treating a stop-loss as a lifelong disqualification of the ticker rather than an exit of the immediate risk, and holding OTM strikes during multi-day recovery bases causing severe theta drag.'
  affected_files:
  - AGENTS.md
  - MASTER_DOCUMENTATION.yaml
  - .agents/skills/datta-price-action-validator/SKILL.md
  - ISSUE_MANAGEMENT.yaml
  resolution: 'Enshrined the Datta & Minervini Law across core project rules:
    1. Stop-Loss as Capital Shield (Outcome Bias Immunity): A triggered stop-loss (e.g. ABCAPITAL 410 CE @ 5.75 protecting against a plunge to 5.05) is an absolute victory of risk discipline; never judge an exit by subsequent market drift.
    2. SL Exits Risk, Not Symbol: Hitting an SL never disqualifies a ticker permanently. When a ticker establishes a fresh institutional sweep base (e.g. Hammer / LL Sweep at key support) and gives a confirmed D2 breakout, re-entry must be executed objectively without ego or hesitation.
    3. Moneyness & Theta Preservation: Prioritize At-The-Money (ATM) or In-The-Money (ITM) strikes on secondary multi-day recovery entries to eliminate accumulated Theta drag and capture full spot delta velocity.'
  status: RESOLVED
