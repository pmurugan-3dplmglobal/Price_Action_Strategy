- id: BUG-044
  title: Timezone-Aware Market Hour & Exit Guard (UTC Cloud VM IST Normalization)
  severity: MEDIUM
  category: Market Timing & Order Execution
  family: EXECUTION_GUARDS
  date_reported: '2026-08-25'
  symptom: 'On Oracle Cloud Linux VM (UTC timezone), position monitor attempted live order exits after market hours (e.g.
    18:30 IST / 13:00 UTC), triggering broker rejection: "Your order could not be converted to a After Market Order (AMO)".

    '
  root_cause: 'is_market_open() and is_new_entry_allowed() evaluated dt.now().time() using local system clock. On UTC cloud
    servers, 13:00 UTC fell within the 09:15-15:30 window, causing false positive market open states.

    '
  affected_files:
  - common/timeframe_utils.py
  - common/position_monitor.py
  - common/resolve.py
  - common/trading_core.py
  resolution: '1. Implemented get_ist_now() in timeframe_utils.py with automatic Asia/Kolkata timezone conversion and UTC+05:30
    fallback.

    2. Updated is_market_open(), is_new_entry_allowed(), and resolve.py cutoff checks to use get_ist_now().

    3. Outside 09:15-15:30 IST, close_position gracefully suppresses live broker calls and logs informational market-closed
    status.

    4. Verified across 14/14 regression tests and deployed to Oracle Cloud VM.

    '
  status: COMPLETED
- id: FEATURE-023
  title: Timeframe-Aware Institutional Tier Scoring — Top-Tier Accumulation & Distribution Alignment
  severity: ENHANCEMENT
  category: Price Action Geometry & Multi-Tier Market Structure
  family: STRATEGY_UPGRADE
  date_reported: '2026-08-25'
  symptom: 'On Daily and Weekly equity swing charts (e.g. TCS Image 4 and POLYCAB Image 9), high-expectancy setups featuring
    multi-week accumulation bases or distribution domes were penalized by narrow parabolic curve metrics and capped at Tier
    2 Core despite R:R > 2.80.

    '
  root_cause: 'Tier 1 Gold previously enforced an intraday parabolic swing filter requirement (sw_waves >= 3) across all timeframes.
    Institutional Wyckoff accumulation/distribution bases develop over 10-20 daily candles, yielding flatter polynomial regression
    fits than narrow 30m option spikes.

    '
  affected_files:
  - common/patterns_bull.py
  - common/patterns_bear.py
  - common/session.py
  resolution: '1. Implemented timeframe-aware tier scoring in patterns_bull.py and patterns_bear.py.

    2. On Daily/Weekly charts (anchor_tf in [''day'', ''week'', ''1d'', ''1w'']), qualified Liquidity Sweep bases with R:R
    >= 2.0 now receive Tier 1 Gold (🥇 T1).

    3. Preserved strict parabolic velocity requirements (R^2 >= 0.55) for Intraday Options scanning.

    4. Verified 100% success across 14/14 regression tests and validated TCS (R:R 2.80) & POLYCAB (R:R 2.83) as Tier 1 Gold.

    '
  status: COMPLETED
- id: FEATURE-022
  title: Price Action Strategy v2.1.0 — Pure 2-Candle Anchors, Color-Independent Point D, 80% Early D Entry & Unified Volatility-Adaptive
    Dynamic Legs
  severity: ENHANCEMENT
  category: Price Action Geometry, Order Timing & Market Microstructure
  family: STRATEGY_UPGRADE
  date_reported: '2026-08-25'
  symptom: '1. Legacy anchor detectors enforced arbitrary 3-bar confirmation lags after the Anchor base, distorting Benchmark
    assignment and causing late Point D triggers.

    2. Point D required a green candle for Bullish / red candle for Bearish, missing valid breakout retests where Point D
    closes beyond Benchmark on a minor opposite-colored body.

    3. Live unclosed candles on 30m charts could trigger false Point D breakouts midway through the candle (e.g. at Minute
    10) before price collapsed back down.

    4. Static min_candles_per_leg=3 failed to adapt to high-beta vs mega-cap stock volatility profiles.

    5. Standalone execution of stock_reversal_scanner.py failed due to a relative import in common/patterns_bear.py.

    '
  root_cause: '1. Legacy anchor functions bundled 3-bar lookahead confirmation inside the base detector instead of isolating
    Anchor A as the pure 2-candle formation.

    2. Overly restrictive color filter on Point D contradicted Datta Playbook rulebook (pure Close > Benchmark criterion).

    3. Point D breakout scanner checked iloc[-1] blindly on live intraday data without checking candle duration completion.

    4. Fixed pivot window lacked ATR volatility normalization across the 200+ F&O universe.

    5. Relative import (.patterns_bull) failed when executed without package context.

    '
  affected_files:
  - common/patterns_bull.py
  - common/patterns_bear.py
  - common/swing_detection.py
  - common/timeframe_utils.py
  - common/resolve.py
  - input/program_config.json
  - MASTER_DOCUMENTATION.yaml
  resolution: '1. Refactored all 10 Anchor detectors to pure 2-candle base formations returning exact AnchorHigh and AnchorLow.

    2. Bound Benchmark strictly to AnchorHigh (Bullish) and AnchorLow (Bearish).

    3. Made Point D breakout strictly color-independent (Close > Benchmark for Bullish / Close < Benchmark for Bearish).

    4. Activated EARLY_D_ENTRY at 80% candle completion (Minute 24 on 30m chart) with +0.3% benchmark buffer and >= 60% proportional
    volume validation.

    5. Implemented Unified Hybrid dynamic leg architecture with 3-tier resolution: Explicit symbol override -> ATR Volatility
    Adaptation -> Global Default.

    6. Replaced relative import in common/patterns_bear.py with robust absolute import.

    7. Verified 100% passing across 14/14 regression tests on Localhost and Oracle Cloud VM.

    '
  status: COMPLETED
