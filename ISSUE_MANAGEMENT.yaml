- id: FEATURE-029
  title: Comprehensive Algo Audit & CVE Hardening - Execution Failsafe, Morning Circuit Breaker, Retest Spacing, Post-Market Filter & Feature 5 (+BE Entry + 2%)
  severity: HIGH
  category: Risk Management & Pattern Execution Hardening
  family: ALGO_AUDIT_CVE
  date_reported: '2026-09-04'
  symptom: '1) When exit orders encountered REJECTED_ERROR, retry tracking was not persisted, risking rapid spam and premature memory eviction.
    2) Positions open during volatile 09:15-09:45 AM opening lacked a catastrophic safety floor against gap-down crashes.
    3) If candle fetch API experienced intermittent downtime or returned empty data, live tick LTP was bypassed instead of checking SL.
    4) Feature 5: TRAIL-1 (+10% Gain Lock) set SL to exact entry (BE), which after slippage and broker STT/charges produced a net negative return.
    5) Retest Point C in patterns_bear.py did not require a green retest candle, and Hammer Baby / Shooting Star Baby lacked mother candle containment checks.
    6) Phantom trade in MIDCPNIFTY26SEP14750CE formed because post-market synthetic auction ticks (15:33:00) generated Anchor A, and a 70-candle runaway drop (> 40 pts) was falsely matched as Point C retest due to unbounded B-to-C distance.'
  root_cause: 'Unbounded retry loops on order reject, absence of opening circuit breaker, coupling of tick monitoring to historical candle fetch, flat entry breakeven without profit buffer, asymmetric bear retest rules, floating baby candles, and unstripped post-15:30 auction bars with unbounded B-to-C retest search.'
  affected_files:
  - common/position_monitor.py
  - common/patterns_bull.py
  - common/patterns_bear.py
  - common/timeframe_utils.py
  - Notes_Inputs.txt
  - scratch/test_cve_fixes.py
  - scratch/run_full_regression_test.py
  - ISSUE_MANAGEMENT.yaml
  resolution: '1. CVE-1 & CVE-2: Updated position_monitor.py save_executed_exit to increment retry_count on REJECTED_ERROR with 15s backoff; memory eviction and trade_db updates made strictly conditional on verified broker fill (exit_ok).
    2. CVE-3: Implemented Morning Catastrophic Circuit Breaker active during 09:15-09:45 AM (-25% for options, -12% for stocks) to prevent deep drawdowns on catastrophic opening shocks.
    3. CVE-4: Decoupled live tick quote lookup from historical candle REST API outages in position_monitor.py.
    4. Feature 5: Updated TRAIL-1 (+10% Gain Lock) to lock Positive Breakeven at +BE: Entry + 2% for Bull (Entry - 2% for Bear), snapped to nearest 0.05 tick.
    5. Pattern Parity & Geometry: Enforced green retest candle for Bear Point C in patterns_bear.py; added mother candle base containment for Hammer Baby (patterns_bull.py) and peak containment for Shooting Star Baby (patterns_bear.py).
    6. Post-Market Filter: Stripped synthetic auction candles (>= 15:30:00 IST) in timeframe_utils.py fetch_and_resample_candles for intraday timeframes.
    7. Retest B-to-C Spacing & Runaway Excursion Guards: Restricted Point C retest search to <= 25 bars after Point B, and invalidated patterns if price rallies/drops > 1.5x risk (or reaches T1) before Point C.
    8. Regression Test Suite: Expanded to 19 test suites in run_full_regression_test.py and 5 targeted unit tests in test_cve_fixes.py, with 100% pass across all tests.'
  status: RESOLVED

