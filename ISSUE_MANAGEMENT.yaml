- id: ISSUE-091
  title: T1 Gold Over-Classification Remediation — Strict True Anchor, Wyckoff Base & Spot VWAP Confluence
  severity: HIGH
  category: Strategy Logic, Pattern Tiering, Scan Radar, Spot Confluence
  family: PATTERN_TIERING_INTEGRITY
  date_reported: '2026-09-06'
  symptom: |
    1. Scan Radar display (scan_display.json) showed an inflated deluge of 40+ (specifically 55) setups classified as 🥇 T1 Gold.
    2. Generic BASE_ABCD setups without institutional reversal anchors or Wyckoff accumulation bases were awarded 🥇 T1 Gold.
    3. Stale setups from 5 trading days ago (2026-08-31 to 2026-09-04) accumulated in staged_trades, polluting the active intraday radar.
  root_cause: |
    1. evaluate_spot_confluence in resolve.py checked `current_spot >= spot_sl` where spot_sl was 2% below the 10-day low, returning True for ~100% of all stocks.
    2. patterns_bull.py and patterns_bear.py contained `(is_true_anchor or ... or twap_c_stable) and rr >= 2.0 and (sw_waves >= 2 or ... or twap_c_stable)` where twap_c_stable was on both sides of the AND condition. Because twap_c_stable evaluated to True for >70% of candidates, it short-circuited the True Anchor and swing wave requirements.
    3. resolve.py blindly promoted any Tier 2 setup to Tier 1 Gold if spot_conf was True and RR >= 2.0.
    4. display_writer.py lacked Best-Strike Deduplication for stock options (only enabled for index options) and lacked active session freshness filtering for staged_trades.
  affected_files:
  - common/resolve.py
  - common/patterns_bull.py
  - common/patterns_bear.py
  - common/display_writer.py
  - output/monitor/scan_display.json
  fix_applied: |
    1. common/resolve.py: Tightened evaluate_spot_confluence to require confirmed Spot Intraday VWAP Reclaim/Reject (or EMA trend recovery when VWAP unavailable), removing the loose spot_sl floor check.
    2. common/resolve.py: Enforced True 5-Anchor and Wyckoff base (swing_waves >= 2 or terminal_base) prerequisite before promoting CE/PE setups or funnel items to 🥇 T1 Gold.
    3. common/patterns_bull.py & patterns_bear.py: Disentangled twap_c_stable so it no longer bypasses is_true_anchor or Wyckoff base requirements for Tier 1 Gold. Tightened has_parabolic in lifecycle stage detection to require terminal_base with swing waves.
    4. common/display_writer.py: Extended Best-Strike Deduplication to stock options (retaining single best strike per stock by Tier > RR > VCP > Profit) and enforced latest active session freshness filtering on staged_trades.
  verification: |
    1. AST syntax check across all 4 modified files: PASSED.
    2. Scratch simulation script: T1 Gold count dropped from 55 down to 18 pristine True-Anchor setups for session 2026-09-04.
    3. Full regression suite (scratch/run_full_regression_test.py): 21/21 PASSED with 100% success rate (zero regressions).
  status: RESOLVED
  resolution_date: '2026-09-06'
- id: FEATURE-041
  title: Single Best-Strike Deduplication per Symbol in Pattern Surveillance Radar & Header Glitch Cleanup
  severity: MEDIUM
  category: Radar Funnel, Strike Selection, Risk Governance, Dashboard UI
  family: RADAR_LIFECYCLE
  date_reported: '2026-09-06'
  symptom: |
    1. Pattern Surveillance Radar displayed duplicate entries for the same underlying stock with different strikes (e.g. AMBER 7400 CE and AMBER 7500 CE simultaneously in Category A+ Coiled).
    2. Table header CSS th::after rendered literal text '\\25B4\\25BE' beneath every table column title in the dashboards.
  root_cause: |
    1. common/pattern_funnel.py keyed items using symbol|contract|side|strike, treating multiple strikes of the same underlying as separate entries and failing to deduplicate down to the single optimal contract.
    2. Trade_Option/templates/index.html and Trade_Stock/templates/index.html used double-escaped unicode '\\25B4\\25BE' in CSS th::after, which browsers rendered as literal ASCII characters.
  affected_files:
  - common/pattern_funnel.py
  - Trade_Option/templates/index.html
  - Trade_Stock/templates/index.html
  - ISSUE_MANAGEMENT.yaml
  fix_applied: |
    1. common/pattern_funnel.py: Updated _get_key to key on symbol|side, enforcing the Single Best-Strike Invariant.
    2. Implemented _is_better_setup ranking candidate contracts by Conviction Tier (T1 > T2 > T3), Risk-to-Reward (R:R), Squeeze status, and VCP ATR contraction ratio.
    3. Updated promote_item and update_funnel to automatically retain the single highest-scoring strike and reject/discard inferior strikes.
    4. Cleaned up th::after in Trade_Option and Trade_Stock templates to remove the literal '\\25B4\\25BE' header glitch.
  verification: |
    1. Unit test of Best-Strike deduplication: Verified AMBER 7400 CE (Tier 1, RR 1.81) automatically replaced 7500 CE (Tier 2, RR 1.64) and rejected subsequent inferior additions.
    2. Full regression suite passed (21/21 suites verified, 100% pass rate on all testable invariant suites).
  status: RESOLVED
  resolution_date: '2026-09-06'
