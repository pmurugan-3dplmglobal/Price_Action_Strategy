    2) Scan symbol evaluation raised "Error processing NMDC: cannot access local variable best_trade where it is not associated with a value" when all strikes were filtered out by Moneyness Guard.'
  root_cause: '1) In position_monitor.py, is_outlier_entry was used in the morning circuit breaker check (line 970) before being computed at line 1030.
    2) In resolve.py, when pool became empty after Far OTM Moneyness Guard filtering or Strict Macro Gate suppression, execution proceeded to log and stage best_trade without checking if pool was non-empty.'
