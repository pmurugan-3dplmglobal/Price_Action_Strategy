  - ISSUE_MANAGEMENT.yaml
  resolution: '1. Replaced all system-local `dt.now().strftime("%H:%M")` and `dt.now().time()` calls in SL evaluations and failsafe monitors with IST-normalized `get_ist_now().strftime("%H:%M")` and `get_ist_now().time()`.
