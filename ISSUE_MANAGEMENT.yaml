issues:
- id: FEATURE-028
  title: Expert Review Phase 2 — EMA Option Rollover, IST Standardization, Option Sizing, Harami Ratio & Theta Guards
  severity: ENHANCEMENT
  category: Engine Execution & Pattern Geometry
  family: EXECUTION_GUARDS
  date_reported: '2026-09-01'
  symptom: '1. EMA engine constructed static monthly contract symbols without rollover awareness, risking buying expiring
    contracts in expiry week.

    2. `is_live_candle_near_close` used naive `dt.now()`, causing clock skew and negative elapsed seconds on UTC cloud VMs
    (Oracle/AWS).

    3. `calculate_position_size` was designed for cash equities, leading to inappropriate unit calculations when applied to
    option premiums.

    4. Bullish/Bearish Harami detectors allowed large inside bars (tweezers/railway tracks) to be classified as Haramis without
    body size ratio checks.

    5. Multi-timeframe Bearish breakout scans had exact string date matching mismatches between daily anchors and intraday
    entry candles.

    6. Weekly options risked holding through Thursday afternoon theta decay into expiry sessions.

    '
  root_cause: 'Missing monthly expiry rollover calculation in EMA engine, unstandardized timezone localization, spot vs premium
    position sizing mismatch, missing Harami inside-to-mother body ratio gate, and missing Thursday pre-expiry exit guard.

    '
  affected_files:
  - common/ema_engine.py
  - common/timeframe_utils.py
  - common/targets.py
  - common/resolve.py
  - common/patterns_bull.py
  - common/patterns_bear.py
  - common/position_monitor.py
  resolution: '1. Added `_get_monthly_expiry_month_str` in `ema_engine.py`: dynamically rolls to next month series if <= 6
    days to monthly expiry.

    2. Standardized `is_live_candle_near_close` in `timeframe_utils.py` to use `get_ist_now().replace(tzinfo=None)`.

    3. Enhanced `calculate_position_size` in `targets.py` with `is_option=True` mode (sizes by option premium, lot size, and
    25% max capital cap) and wired into `resolve.py`.

    4. Added Inside Body <= 65% Mother Body filter to `find_anchor_bullish_harami` and `find_anchor_bearish_harami`.

    5. Added normalized date prefix matching in `patterns_bear.py` (`scan_anchor_bcd_breakout_bearish`) and fixed floating
    point precision on RR threshold.

    6. Added Thursday 15:15 EOD Weekly Option Pre-Expiry Theta Protection Guard in `position_monitor.py`.

    7. Verified with 38 unit tests in `scratch/test_vix_portfolio_volume.py` (100% pass) and 14 full regression test suites
    (100% pass).

    '
  status: COMPLETED
- id: FEATURE-027
  title: India VIX Regime Gate, Portfolio Risk Caps & BCD Volume Profile Analysis
  severity: ENHANCEMENT
  category: Risk Management & Pattern Analysis
  family: EXECUTION_GUARDS
  date_reported: '2026-09-01'
  symptom: '1. High market volatility (India VIX > 20) caused lower completion rates for Tier 2 Core and Tier 3 Momentum setups.

    2. No portfolio-level governance capped concurrent open positions, maximum daily loss drawdowns, or same-sector exposure
    concentration.

    3. A-B-C-D breakout engine lacked volume profile verification on Point B (expansion), Point C (retest volume dry-up),
    and Point D (institutional trigger conviction).

    '
  root_cause: 'Missing macro volatility gate, cross-engine portfolio risk limits, and volume metrics on candlestick geometry
    stages.

    '
  affected_files:
  - common/vix_guard.py
  - common/portfolio_risk.py
  - common/registries.py
  - common/trading_core.py
  - common/patterns_bull.py
  - common/patterns_bear.py
  - common/resolve.py
  - Trade_Stock/stock_reversal_scanner.py
  - input/program_config.json
  resolution: '1. Implemented `vix_guard.py` with 60-second TTL cache: suppresses T2/T3 setups when VIX > 20.0, and halts
    all new trade entries when VIX > 25.0.

    2. Implemented `portfolio_risk.py` with `check_portfolio_risk_caps`: enforces max 6 concurrent positions, max -3% daily
    drawdown loss limit, and max 2 positions in the same sector via `SECTOR_MAP`.

    3. Added comprehensive `SECTOR_MAP` and `get_symbol_sector` in `registries.py` covering all ~180+ F&O stocks across 10
    industry sectors.

    4. Added BCD Volume Profile analysis in `patterns_bull.py` and `patterns_bear.py`: calculates `vol_b_ratio`, `vol_c_ratio`
    (dry-up), `vol_d_ratio` (trigger expansion), `vol_confirmed`, and `vol_score`.

    5. Wired VIX and Portfolio risk checks into `resolve.py` (`scan_symbol`) and `stock_reversal_scanner.py` (`run_scan`).

    6. Verified with 25 new unit tests and 14-test regression suite (100% pass).

    '
  status: COMPLETED
- id: FEATURE-026
  title: Real-Time Incremental Scan Display Streaming & Institutional Risk Controls
  severity: ENHANCEMENT
  category: Strategy Engine & UI Streaming
  family: EXECUTION_GUARDS
  date_reported: '2026-08-31'
  symptom: '1. Scanners waited until an entire 210-stock cycle finished before writing to `scan_display.json`, causing blank
    tables during long scan cycles.

    2. Friday weekend carry exposed stagnant option positions to theta decay.

    3. OTM strikes were sometimes selected over higher-Delta 1-step ITM strikes.

    4. False wick stopouts occurred when option premium fluctuated while cash spot was holding strong support.

    '
  root_cause: 'Display file was only written at cycle completion; missing spot-anchored SL validation and ITM prioritization
    in strike resolution.

    '
  affected_files:
  - common/display_writer.py
  - common/position_monitor.py
  - common/resolve.py
  - Trade_Option/index_options_trade_engine.py
  - Trade_Option/stock_options_trade_engine.py
  - Trade_Option/app_option_Trade.py
  resolution: '1. Implemented real-time incremental display streaming in both Index and Stock option engines as each symbol
    resolves.

    2. Added Friday 15:15 EOD Intelligent Carry Gate to close stagnant positions before weekend theta bleed.

    3. Updated strike candidate ranking to prioritize 1-step ITM / high-Delta options.

    4. Implemented Spot-Anchored Structural SL Guard to protect against false option premium wicks.

    '
  status: COMPLETED
- id: ISSUE-076
  title: Windows File-Lock Concurrency & Rate Limit Hardening
  severity: MEDIUM
  category: Persistence & Concurrency
  family: PERSISTENCE
  date_reported: '2026-08-31'
  symptom: '1. High-frequency display writes raised `[WinError 5] Access is denied` on `scan_display.json.tmp -> scan_display.json`
    during concurrent dashboard reads.

    2. Rapid multi-threaded position queries triggered Zerodha rate limits.

    '
  root_cause: 'Windows file system locks files during active read operations, colliding with un-retried `os.replace` calls.

    '
  affected_files:
  - common/display_writer.py
  - common/dashboard_sl_overrides.py
  - common/ema_engine.py
  resolution: '1. Implemented PID-isolated temp files (`.tmp.<PID>`), 5-attempt exponential backoff retry loops, and direct-write
    fallbacks across all file-writing modules.

    2. Wrapped position queries in `safe_kite_call` to automatically throttle and retry on rate limits.

    '
  status: COMPLETED
