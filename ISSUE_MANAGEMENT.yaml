- id: ISSUE-056
  title: Institutional Zero-Trade-Starvation Architecture - Option VWAP Guard, Point C TWAP Base Stability, Spot Confluence Mapping & Continuous 15% Loss Shield
  severity: ARCHITECTURAL
  category: Strategy & Execution Optimization
  family: INSTITUTIONAL_ENHANCEMENTS
  date_reported: '2026-09-05'
  symptom: 'Prop firm audit identified gaps in institutional parity: 1) Overpaying for option contracts during momentum surges where premium extends far above intraday VWAP; 2) Point C absorption bases lacked quantitative tightness metrics to promote pristine institutional accumulation; 3) "Option chart illusion" where option timeframes diverged from higher-timeframe spot market structure; 4) Index options engine allowed wider Far OTM strikes (strike_range 3); 5) Spot SL Guard suppressed the 15% Hard Max Stop-Loss allowing option drawdowns up to 35%; 6) Wide bid-ask spreads paid taker penalty unnecessarily.'
  root_cause: 'Missing contract-level VWAP metrics, missing Point C TWAP dispersion measurement, lack of relative multi-timeframe spot mapping, index options strike_range defaulted to 3, and spot guard suppression logic overlooked HARD_MAX_15PCT_SL in position_monitor.py.'
  affected_files:
  - common/swing_detection.py
  - common/patterns_bull.py
  - common/patterns_bear.py
  - common/resolve.py
  - common/display_writer.py
  - common/trading_core.py
  - common/position_monitor.py
  - Trade_Option/index_options_trade_engine.py
  - Trade_Option/stock_options_trade_engine.py
  - input/program_config.json
  resolution: 'Implemented 7 institutional upgrades under a zero-trade-starvation architecture:
    1. Option Contract VWAP Guard: Added calculate_option_vwap() tracking intraday contract VWAP and stretch percentage; integrated soft scoring bonus (+2 for FAIR <=8%, 0 neutral for EXPANDED 8-15%, -2 penalty for STRETCHED >15%) without hard rejection.
    2. Point C TWAP Base Stability: Added calculate_twap_c_stability() evaluating standard deviation of Point C absorption base relative to risk distance (std <= 0.25 * risk); pristine bases qualify setups for Tier 1 Gold / STAGE_A_PLUS_READY.
    3. Spot-Relative Confluence Mapping: Added get_mapped_spot_timeframe() mapping 3m/5m option -> 15m spot, 15m option -> 60m spot, 30m option -> daily spot. Evaluated 13 EMA alignment on mapped spot TF as an additive candidate ranking bonus (+1).
    4. Far OTM Moneyness Armor: Hardened index_options_trade_engine.py and program_config.json with default strike_range=1 (ATM/1-ITM/1-OTM), preventing Far OTM Delta decay.
    5. Continuous 15% Greek-Adjusted Loss Ceiling: Exempted HARD_MAX_15PCT_SL and morning catastrophic circuits from Spot SL Guard suppression in position_monitor.py; aligned is_catastrophic_opt to 15% (1.0 - max_loss_pct).
    6. 2-Stage Pegged Limit Routing: In execute_highest_rr_trade, placed limit orders at mid-price when bid-ask spread >= 0.8%, preserving execution speed and saving slippage.
    7. Full regression test passed with 100% success.'
  status: RESOLVED

