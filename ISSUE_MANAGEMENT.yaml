meta:
  system: Price Action Unified Strategy System
  version: v2.1.0-stable
  last_updated: '2026-09-05'
  purpose: Document operational failures, root causes, regression fixes, and system enhancements for v2.1.0-stable.
  historical_archive: archive/ISSUE_HISTORY_ARCHIVE.yaml (Preserves 84 resolved legacy issues prior to 2026-08-25)
issues:
- id: ISSUE-087
  title: Long Option Buyer Invariant Inversion in PE Option Lifecycle Evaluation & Radar Eviction
  severity: CRITICAL
  category: Strategy Execution, Option Domain Rules & Lifecycle Management
  family: OPTION_BUYER_INVARIANT
  date_reported: '2026-09-05'
  symptom: 'PE options (e.g. FORTIS26SEP910PE) in the Fast Surveillance Radar were assigned SL floors above current price (SL=23.71 > Price=22.20) and prematurely evicted with log: [RADAR EVICT] FORTIS breached SL floor (22.2 <= 23.71).'
  root_cause: 'In common/resolve.py, PE option contracts were erroneously passed to scan_pattern_lifecycle_stage_bearish with side=BEAR instead of evaluating them as Long Option Buyers (bullish price expansion on the option chart itself). This inverted the Stop Loss floor into the Anchor High (resistance), causing buyer breakout radar checks (c_now <= sl) to misinterpret premium drift as a breakdown.'
  affected_files:
  - common/resolve.py
  resolution: '1. Replaced scan_pattern_lifecycle_stage_bearish with scan_pattern_lifecycle_stage(side=BULL) for PE option contracts in common/resolve.py.
    2. Updated is_anchor_valid_and_active and get_anchor_invalidation_reason for PE options to evaluate side=BULL.
    3. Corrected Stage B anchor benchmark to AnchorHigh for PE options, aligning with buyer breakout execution.
    4. Verified 100% pass across all 20 regression tests in scratch/run_full_regression_test.py.'
  status: RESOLVED
- id: ISSUE-086
  title: Windows File-Lock Concurrency & Access Denied Error in Pattern Funnel Atomic Persistence
  severity: HIGH
  category: File Persistence, Concurrency & Operating System I/O
  family: WINDOWS_FILE_LOCK
  date_reported: '2026-09-05'
  symptom: 'save_funnel_state threw [WinError 5] Access is denied while replacing pattern_funnel.json.tmp into pattern_funnel.json during concurrent scan discovery and fast radar loop execution.'
  root_cause: 'Static tmp file naming (pattern_funnel.json.tmp) caused write collisions between parallel scanner cycles and fast radar loops, combined with raw os.replace without Windows permission retry backoff or direct write fallback.'
  affected_files:
  - common/pattern_funnel.py
  resolution: '1. Hardened save_funnel_state in common/pattern_funnel.py with dynamic per-process, per-thread temporary filenames (pattern_funnel.json.tmp.{pid}.{tid}).
    2. Implemented a 5-attempt retry loop with exponential backoff (0.05s * attempt) catching PermissionError and OSError.
    3. Added a direct-write fallback if atomic rename is blocked by external process readers.
    4. Added a 3-attempt read retry loop in load_funnel_state to prevent collisions during concurrent writes.
    5. Verified 100% pass across all 20 regression tests.'
  status: RESOLVED
- id: FEATURE-037
  title: Documentation Consolidation, Tiered Issue Archive, Per-Turn Token Optimization & Dead Backup Encapsulation
  severity: ENHANCEMENT
  category: Architecture, Token Economics & Documentation Maintenance
  family: DOC_OPTIMIZATION
  date_reported: '2026-09-05'
  symptom: 'Repository documentation grew to 450.4 KB (~122,376 tokens) with 122 issues in ISSUE_MANAGEMENT.yaml (52,171 tokens alone) and AGENTS.md (4,033 tokens) injected as a persistent rule on every turn, causing context bloat and high token consumption.'
  root_cause: 'Accumulation of 84 resolved historical issues in the active tracker, loose uncompressed legacy text files in archive/legacy_backup/, redundant directory trees in AGENTS.md, and fragmented documentation across subfolders.'
  affected_files:
  - AGENTS.md
  - AI_CONTEXT_INDEX.md
  - ISSUE_MANAGEMENT.yaml
  - MASTER_DOCUMENTATION.yaml
  - Notes_Inputs.txt
  - archive/ISSUE_HISTORY_ARCHIVE.yaml
  - archive/Notes_Inputs_Completed_Archive.txt
  - archive/legacy_backup.zip
  - docs/FNO_Scanning_Workflow_Spec.md
  - archive/reports/
  resolution: '1. Split ISSUE_MANAGEMENT.yaml into an active tracker (38 v2.1.0-stable issues) and archive/ISSUE_HISTORY_ARCHIVE.yaml (84 historical issues), reducing active issue tokens by 62.3% (from 52,171 to ~19,679 tokens) with 100% record preservation.
    2. Streamlined AGENTS.md from 14.8 KB (4,033 tokens) to 7.1 KB (2,016 tokens), achieving an immediate 50% permanent token reduction on every conversational turn while preserving all personas, rules, and invariants.
    3. Encapsulated archive/legacy_backup/ into archive/legacy_backup.zip, preserving 27 legacy backup files bit-for-bit while removing 46 KB of loose text from repository search space.
    4. Consolidated FNO_Scanning_Workflow_Spec.md into docs/ and organized superseded August reports into archive/reports/.
    5. Cleaned Notes_Inputs.txt down to pending backlog items and archived completed scratch notes in archive/Notes_Inputs_Completed_Archive.txt.
    6. Verified all 17 offline regression tests pass with zero regressions.'
  status: RESOLVED
- id: FEATURE-031
  title: Volatility Contraction Pattern (VCP) Metrics, ATR Compression Ratio & TTM Squeeze Integration
  severity: ENHANCEMENT
  category: Quantitative Price Action, Volatility Analysis & Candidate Prioritization
  family: VCP_METRICS
  date_reported: '2026-09-04'
  symptom: 'Trading engine lacked quantitative measurement of volatility compression before breakout, treating wide high-volatility bases and ultra-tight coiled structures identically in trade execution prioritization.'
  root_cause: 'Missing mathematical quantification of volatility contraction (ATR3 / ATR14) and Bollinger/Keltner channel squeeze in pattern lifecycle and candidate ranking algorithms.'
  affected_files:
  - common/swing_detection.py
  - common/patterns_bull.py
  - common/patterns_bear.py
  - common/resolve.py
  - common/display_writer.py
  - Trade_Option/stock_options_trade_engine.py
  - Trade_Option/templates/index.html
  - Trade_Stock/templates/index.html
  resolution: '1. Implemented calculate_vcp_metrics in common/swing_detection.py computing True Range, ATR(14), ATR(3), Bollinger Bands (20, 2.0 std), and Keltner Channels (20, 1.5 ATR) to derive Contraction Ratio (ATR3/ATR14) and TTM Squeeze state.
    2. Enriched pattern lifecycle detectors in common/patterns_bull.py and common/patterns_bear.py with atr_ratio, is_squeeze, vcp_tier, and vcp_badge across Full ABCD, Stage A+, Stage A, and Stage B.
    3. Updated common/resolve.py and display_writer.py to propagate VCP metrics into trade_data, funnel_items, and dashboard serializations.
    4. Enhanced candidate prioritization (_avg_target_rank) in stock_options_trade_engine.py with ranking bonuses for active TTM squeeze (+0.50) and heavy ATR compression (+0.30).
    5. Added dynamic visual badges (🔥 ULTRA SQZ, ⚡ VCP) and VCP metrics column to Pattern Radar and Scans tabs in Options and Stock dashboards.
    6. Verified 100% pass across dedicated VCP unit tests and full 20-test regression suite.'
  status: RESOLVED
- id: FEATURE-030
  title: Price Action Surveillance Radar (Categories A+, A, B), Sub-15s Fast Execution Loop & Candidate Non-Blocking
  severity: ENHANCEMENT
  category: Architecture, Engine Latency & Execution Speed
  family: RADAR_LIFECYCLE
  date_reported: '2026-09-04'
  symptom: '1. Scanned trades staged on Scan Tab during live market did not execute on Zerodha Kite because full universe scans (213 F&O symbols) took hours, delaying order firing until after market close.
    2. execute_highest_rr_trade picked single max() candidate with flat return on rejection or duplication, starving all other high-conviction candidates.
    3. app_option_Trade called kite.positions() every 3 seconds, triggering HTTP 429 rate limit / Cloudflare 502 bad gateway on Zerodha Kite API.
    4. Incubating patterns were discarded until full D-trigger breakout, lacking forward surveillance visibility.
    '
  root_cause: 'Monolithic scan-and-execute loop with head-of-line blocking, lack of staged pattern lifecycle persistence, and over-aggressive broker position polling.
    '
  affected_files:
  - common/paths.py
  - common/pattern_funnel.py
  - common/patterns_bull.py
  - common/patterns_bear.py
  - common/trading_core.py
  - common/resolve.py
  - Trade_Option/index_options_trade_engine.py
  - Trade_Option/stock_options_trade_engine.py
  - Trade_Option/app_option_Trade.py
  - Trade_Option/templates/index.html
  - scratch/run_full_regression_test.py
  resolution: '1. Implemented Pattern Funnel Manager (common/pattern_funnel.py) managing Category A+ (Imminent Velocity), Category A (Ready), and Category B (Incubator) with atomic persistence and exclusivity enforcement.
    2. Implemented scan_pattern_lifecycle_stage in common/patterns_bull.py and patterns_bear.py.
    3. Created high-frequency Fast Surveillance Radar thread (fast_radar_loop) in stock_options_trade_engine.py running every 15s to fire orders instantly upon D-trigger cross without waiting for 213-symbol background cycle.
    4. Eliminated Head-of-Line blocking in execute_highest_rr_trade across stock and index engines using sorted candidate loop with fallback evaluation.
    5. Throttled broker position fetching in app_option_Trade.py from 3s to 15s.
    6. Added /api/pattern-funnel endpoint and dedicated Pattern Surveillance Radar tab in templates/index.html.
    7. Verified with 100% pass across all 20 regression tests.
    '
  status: RESOLVED
- id: FEATURE-029
  title: Expert Algo Audit Phase 3 — Broker Exit Safety (CVE-1/2), Morning Circuit (CVE-3), Candle API Decoupling (CVE-4), +BE Trailing & Pattern Parity
  severity: HIGH
  category: Execution Safety, Risk Governance & Pattern Geometry
  family: EXECUTION_GUARDS
  date_reported: '2026-09-04'
  symptom: '1. If all 3 exit tiers failed, save_executed_exit marked REJECTED_ERROR, permanently blocking subsequent exit retries while positions remained naked on Zerodha.
    2. monitor_active_positions prematurely evicted positions from memory and updated trade_db even when Kite exit orders failed.
    3. The 09:15-09:45 AM SL blindspot left positions unprotected against catastrophic opening gap-down drops.
    4. Historical candle REST API outages completely bypassed live tick monitoring and emergency stop losses.
    5. Trailing stop to flat Breakeven on +10% gains resulted in spread slippage losses on fast reversals.
    6. Bear scanner accepted any candle color for Point C (no green retest enforcement) and was capped at 30 bars per leg.
    7. Hammer and Shooting Star baby candle detectors lacked mother candle base/peak containment checks.
    '
  root_cause: 'Missing retry backoff for REJECTED_ERROR in exit guard, unverified broker fill on memory eviction, absence of morning catastrophic circuit breaker, coupling of tick checks to candle fetch, flat breakeven instead of positive slippage cushion, and structural asymmetries between bull and bear pattern modules.
    '
  affected_files:
  - common/position_monitor.py
  - common/patterns_bear.py
  - common/patterns_bull.py
  - Notes_Inputs.txt
  resolution: '1. CVE-1 Fix: Implemented exponential backoff and retry count tracking for REJECTED_ERROR in close_position and close_stock_position.
    2. CVE-2 Fix: Made memory eviction (to_clear.append) and trade_db status updates strictly conditional on verified broker order success.
    3. CVE-3 Fix: Added Morning Catastrophic Circuit Breaker active during 09:15-09:45 AM (triggers immediate exit on >= 25% drop for options, >= 12% for stocks).
    4. CVE-4 Fix: Decoupled live tick quote lookup from historical candle REST endpoint, ensuring emergency stops run even if candle fetch fails.
    5. Feature 5 Fix: Implemented Positive Breakeven (+BE: Entry + 2% for Bull, Entry - 2% for Bear, snapped to 0.05 tick) upon reaching +10% peak gain.
    6. Pattern Parity: Enforced green retest candle on Bear Point C and expanded search window to 60 bars with staleness protection.
    7. Geometric Precision: Added base containment check on find_anchor_hammer_baby and peak containment on find_anchor_shooting_star_baby.
    8. Verified with 100% pass across 47 unit tests and all 18 regression tests.
    '
  status: RESOLVED
- id: FEATURE-028
  title: Expert Review Phase 2 — EMA Option Rollover, IST Standardization, Option Sizing, Harami Ratio & Theta Guards
  severity: ENHANCEMENT
  category: Engine Execution & Pattern Geometry
  family: EXECUTION_GUARDS
  date_reported: '2026-09-01'
  symptom: '1. EMA engine constructed static monthly contract symbols without rollover awareness, risking buying expiring
    contracts in expiry week.

    2. `is_live_candle_near_close` used naive `dt.now()`, causing clock skew and negative elapsed seconds on UTC cloud VMs
    (Oracle/AWS).

    3. `calculate_position_size` was designed for cash equities, leading to inappropriate unit calculations when applied to
    option premiums.

    4. Bullish/Bearish Harami detectors allowed large inside bars (tweezers/railway tracks) to be classified as Haramis without
    body size ratio checks.

    5. Multi-timeframe Bearish breakout scans had exact string date matching mismatches between daily anchors and intraday
    entry candles.

    6. Weekly options risked holding through Thursday afternoon theta decay into expiry sessions.

    '
  root_cause: 'Missing monthly expiry rollover calculation in EMA engine, unstandardized timezone localization, spot vs premium
    position sizing mismatch, missing Harami inside-to-mother body ratio gate, and missing Thursday pre-expiry exit guard.

    '
  affected_files:
  - common/ema_engine.py
  - common/timeframe_utils.py
  - common/targets.py
  - common/resolve.py
  - common/patterns_bull.py
  - common/patterns_bear.py
  - common/position_monitor.py
  resolution: '1. Added `_get_monthly_expiry_month_str` in `ema_engine.py`: dynamically rolls to next month series if <= 6
    days to monthly expiry.

    2. Standardized `is_live_candle_near_close` in `timeframe_utils.py` to use `get_ist_now().replace(tzinfo=None)`.

    3. Enhanced `calculate_position_size` in `targets.py` with `is_option=True` mode (sizes by option premium, lot size, and
    25% max capital cap) and wired into `resolve.py`.

    4. Added Inside Body <= 65% Mother Body filter to `find_anchor_bullish_harami` and `find_anchor_bearish_harami`.

    5. Added normalized date prefix matching in `patterns_bear.py` (`scan_anchor_bcd_breakout_bearish`) and fixed floating
    point precision on RR threshold.

    6. Added Thursday 15:15 EOD Weekly Option Pre-Expiry Theta Protection Guard in `position_monitor.py`.

    7. Verified with 38 unit tests in `scratch/test_vix_portfolio_volume.py` (100% pass) and 14 full regression test suites
    (100% pass).

    '
  status: COMPLETED
- id: FEATURE-027
  title: India VIX Regime Gate, Portfolio Risk Caps & BCD Volume Profile Analysis
  severity: ENHANCEMENT
  category: Risk Management & Pattern Analysis
  family: EXECUTION_GUARDS
  date_reported: '2026-09-01'
  symptom: '1. High market volatility (India VIX > 20) caused lower completion rates for Tier 2 Core and Tier 3 Momentum setups.

    2. No portfolio-level governance capped concurrent open positions, maximum daily loss drawdowns, or same-sector exposure
    concentration.

    3. A-B-C-D breakout engine lacked volume profile verification on Point B (expansion), Point C (retest volume dry-up),
    and Point D (institutional trigger conviction).

    '
  root_cause: 'Missing macro volatility gate, cross-engine portfolio risk limits, and volume metrics on candlestick geometry
    stages.

    '
  affected_files:
  - common/vix_guard.py
  - common/portfolio_risk.py
  - common/registries.py
  - common/trading_core.py
  - common/patterns_bull.py
  - common/patterns_bear.py
  - common/resolve.py
  - Trade_Stock/stock_reversal_scanner.py
  - input/program_config.json
  resolution: '1. Implemented `vix_guard.py` with 60-second TTL cache: suppresses T2/T3 setups when VIX > 20.0, and halts
    all new trade entries when VIX > 25.0.

    2. Implemented `portfolio_risk.py` with `check_portfolio_risk_caps`: enforces max 6 concurrent positions, max -3% daily
    drawdown loss limit, and max 2 positions in the same sector via `SECTOR_MAP`.

    3. Added comprehensive `SECTOR_MAP` and `get_symbol_sector` in `registries.py` covering all ~180+ F&O stocks across 10
    industry sectors.

    4. Added BCD Volume Profile analysis in `patterns_bull.py` and `patterns_bear.py`: calculates `vol_b_ratio`, `vol_c_ratio`
    (dry-up), `vol_d_ratio` (trigger expansion), `vol_confirmed`, and `vol_score`.

    5. Wired VIX and Portfolio risk checks into `resolve.py` (`scan_symbol`) and `stock_reversal_scanner.py` (`run_scan`).

    6. Verified with 25 new unit tests and 14-test regression suite (100% pass).

    '
  status: COMPLETED
