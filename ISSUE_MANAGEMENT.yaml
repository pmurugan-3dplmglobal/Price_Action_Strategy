    5. UI Active Positions table treated any position with side "PE" as short sale (entry - ltp), breaking P&L display for retail option buyers.'
  root_cause: 'Naive substring matching ("PE" in contract) instead of verifying option contract syntax (ends with CE/PE and contains digits); missing live broker iteration in stock exit-all endpoint; lack of short-awareness in failsafe risk monitoring conditions; lack of abs() sanitization in stock exit order construction; and treating option side "PE" identically to equity "SELL".'
