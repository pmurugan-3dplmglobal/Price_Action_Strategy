    2. Initialized non-Nifty50 tokens to 0 in _populate_stock_registry_from_cache so equity scanners resolve valid NSE cash tokens from instrument master rather than NFO option contracts.
    3. Made is_liquid_cash_stock timeframe-aware: dynamically scales 20-period volume by candles_per_day and uses realistic 2.0 Cr turnover / 100k volume bounds.
    4. Normalized timestamps with clean_timestamp()[:10] in stock_reversal_scanner.py and resolve.py so same-day terminal base setups are retained.
    5. Mapped entry_time to CandleTime/D_time and candle_a_time to CandleATime/A_time in stock_reversal_scanner.py.
    6. Added CandleTime and CandleATime aliases to scan_trend_continuation_reentry in patterns_bull.py and patterns_bear.py.
    7. Updated formatTimestamp in Option and Stock UI templates to display proper date without forcing 09:15 for Daily/Weekly candles, while retaining exact candle timestamps for intraday timeframes.
    8. Unit test suite expanded to 47 tests (100% pass) and master regression test suite verified 17/17 passed (100%).
    '
