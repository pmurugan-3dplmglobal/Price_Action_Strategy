  category: Strategy Risk, Position Sizing, Expiry Rollover, Morning Reconciler
  family: QUANT_ENHANCEMENTS
  date_reported: '2026-09-06'
  symptom: |
    1. Tier-based capital sizing (Tier 1 = 100%, Tier 2 = 70%, Tier 3 = 50%) documented in MASTER_DOCUMENTATION.yaml was not enforced in calculate_position_size, causing all tiers to deploy equal 100% capital.
    2. stock_options_trade_engine.py:407 called calculate_position_size(cp, current_sl) without passing UI-configured capital, risk_percent, lot_size, is_option=True, or tier.
    3. morning_reconciler.py overnight opening gap audit only checked if is_bull, silently ignoring Bearish short equity positions that gap up through Stop Loss or gap down past Target T1.
    4. index_options_trade_engine.py resolve_option_contract lacked afternoon 0DTE expiry rollover protection, buying expiring contracts late on expiry day (post-13:30 IST) subjected to catastrophic theta decay.
  root_cause: |
    1. calculate_position_size did not accept tier or scale effective capital by conviction tier.
    2. resolve.py computed pos_size before finalizing tier promotion (tier_ce = 1 for confirmed D1 Gold setups).
    3. morning_reconciler.py lacked parity branches for (not is_bull).
    4. index_options_trade_engine.py always selected expiries[0] without time-of-day rollover guard.
  affected_files:
  - common/targets.py
  - common/resolve.py
  - Trade_Option/stock_options_trade_engine.py
  - common/morning_reconciler.py
  - Trade_Option/index_options_trade_engine.py
  - scratch/test_tier_gap_expiry_enhancements.py
  fix_applied: |
    1. targets.py: Added tier parameter to calculate_position_size with conviction scaling: Tier 1 = 1.0, Tier 2 = 0.70, Tier 3 = 0.50 multiplier on account capital. Default tier=1 ensures zero regression.
    2. resolve.py: Finalized tier (including D1 Gold promotion) before calling calculate_position_size(..., tier=tier_ce/tier_pe).
    3. stock_options_trade_engine.py: Used best.get("position_size") or fallback calculate_position_size with UI-configured capital, risk_percent, lot_size, is_option=True, and tier.
    4. morning_reconciler.py: Added Bearish short equity gap-up breach (ltp/open >= SL -> immediate graceful exit) and gap-down windfall (ltp/open <= T1 -> ratchet SL to BE).
    5. index_options_trade_engine.py: Added 0DTE afternoon protection: on expiry day (days_rem == 0) and time >= 13:30 IST, rolls contract selection to next weekly series (expiries[1]).
