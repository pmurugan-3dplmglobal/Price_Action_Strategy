- id: ISSUE-090
  title: Expert Code Audit — 5 Bug Fixes (Missing numpy, AnchorLow Overwrite, Bearish R:R, Index Engine Ask/Product)
  severity: CRITICAL
  category: Strategy Logic, Pattern Detection, Risk Management, Order Execution
  family: EXPERT_AUDIT_BUGFIX
  date_reported: '2026-09-06'
  symptom: |
    1. CRITICAL: resolve.py spot_vwap always returned 0.0, completely disabling SPOT_VWAP_RECLAIM confluence checks and D1 Gold Tier promotions.
    2. HIGH: patterns_bull.py scan_anchor_bcd_breakout line 321 overwrote a_low with single candle low, breaking Left-Side Rule for LL Sweep and Two Higher Highs multi-candle patterns.
    3. HIGH: targets.py calc_rr returned 0 for all bearish trades because risk = entry - sl was negative (SL > entry for shorts).
    4. MEDIUM: index_options_trade_engine.py execute_index_entry never parsed ask price from Kite depth, always falling back to LTP * 1.005.
    5. MEDIUM: index_options_trade_engine.py monitor_active_positions used PRODUCT_MIS but orders were placed with PRODUCT_NRML, causing position monitor to miss live index option positions.
  root_cause: |
    1. Missing `import numpy as np` in resolve.py — NameError silently caught by broad except, defaulting spot_vwap to 0.0.
    2. Redundant `a_low = float(a['low'])` on line 321 overwriting the correct AnchorLow set on line 316 from pattern detector.
    3. calc_rr computed `risk = entry - sl` which is negative for bearish trades (SL > entry), hitting the `risk <= 0` guard.
    4. `ask = 0` initialized but never populated from `depth['sell'][0]['price']`.
    5. execute_index_entry used PRODUCT_NRML but monitor_active_positions passed PRODUCT_MIS to shared_monitor_positions.
  affected_files:
  - common/resolve.py
  - common/patterns_bull.py
  - common/targets.py
  - Trade_Option/index_options_trade_engine.py
  fix_applied: |
    1. Added `import numpy as np` to resolve.py imports — spot_vwap now correctly computed via np.sum().
    2. Removed redundant `a_low = float(a['low'])` line — AnchorLow from pattern detector preserved for Left-Side Rule.
    3. Changed calc_rr to use `risk = abs(entry - sl)` and `abs(t - entry)` for direction-agnostic R:R.
    4. Added ask extraction: `if depth and len(depth) > 0 and depth[0].get("price", 0) > 0: ask = float(depth[0]["price"])`.
    5. Changed monitor_active_positions from PRODUCT_MIS to PRODUCT_NRML to align with order placement.
  verification: |
    AST syntax check: 4/4 files PASSED.
    Regression suite: 18/21 PASSED (3 failures are Kite API auth — expected without live access_token).
    All strategy, pattern, DB, parity, math, and architecture tests pass.
  status: RESOLVED
  resolution_date: '2026-09-06'
