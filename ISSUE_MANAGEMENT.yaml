- id: ISSUE-071
  title: Dual-Monitor Exit Race Condition and Margin Rejection Spam Loop Fix
  severity: HIGH
  category: Position Management / Execution Guard
  family: DEFECT
  date_reported: '2026-08-19'
  symptom: 'At 09:45:00 AM failsafe expiration, rapid duplicate SELL orders fired every 2-3 seconds for active positions (POWERGRID,
    HINDALCO, NTPC), leading to repeated "REJECTED - Insufficient funds (margin required 128k)" errors in Kite orderbook.

    '
  root_cause: '1. Concurrent execution: Options Dashboard (app_option_Trade.py) failsafe monitor and engine active position
    monitor both initiated exits simultaneously at 09:45 AM.

    2. The primary SELL order locked held long quantity in Kite orderbook; secondary SELL orders were treated by Zerodha as
    naked short sells requiring overnight margin.

    3. Faulty exit guard reset: position_monitor.py had ''has_live_qty'' in guard reset condition, which wiped EXECUTED_EXITS
    immediately while an open order was pending fill.

    4. Instant retry loop: REJECTED status in orderbook immediately cleared exit guards without backoff cooldown.

    '
  affected_files:
  - common/position_monitor.py
  - common/trading_core.py
  - Trade_Option/app_option_Trade.py
  - Trade_Stock/app_Sock_Trade.py
  - ISSUE_MANAGEMENT.yaml
  resolution: '1. Live Net Quantity Cap: close_position & close_stock_position verify net held quantity against Kite API.
    If net_qty <= 0, mark as ALREADY_CLOSED and skip order placement. If net_qty > 0, clamp order quantity to min(qty, net_held_qty)
    to prevent naked shorts.

    2. Exit Guard Reset Fix: Removed ''has_live_qty'' from guard reset logic; only reset guard on genuine newer re-entries
    (pos_entry_time > exit_order_timestamp).

    3. Rejection Cooldown & Order Debounce: Enforced 30-second cooldown on REJECTED/CANCELLED orders and 15-second fill-wait
    on OPEN/TRIGGER PENDING orders before attempting fallbacks.

    4. Dashboard Failsafe Check: Added is_contract_exit_executed checks in app_option_Trade.py and app_Sock_Trade.py failsafe
    loops to prevent dual-monitor firing.

    5. Verified 13/13 regression suite tests passed with 100% success.

    '
