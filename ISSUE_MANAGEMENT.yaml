  - id: FEATURE-010
    title: Dual Monitoring Split (09:15 AM Target Exit vs 09:45 AM SL Failsafe)
    severity: ENHANCEMENT
    category: Risk Management & Strategy Execution
    date_reported: "2026-08-01"
    symptom: |
      Single monitoring loop evaluated both SL and Target simultaneously during volatile 09:15-09:45 AM opening window, risking premature SL shakeouts.
    root_cause: |
      Need to separate Target monitoring (active from 09:15 AM open) from SL monitoring (deferred to 09:45 AM+ with 3-way confirmation).
    affected_files:
      - common/trading_core.py
    resolution: |
      Updated monitor_active_positions in common/trading_core.py: Target monitoring remains active from 09:15 AM. SL monitoring skips 09:15-09:45 AM window, evaluates a 3-way failsafe check at 09:45 AM (LTP < SL & prev candle closed < SL & current candle trading < SL), then resumes continuous SL monitoring after 09:45 AM.
    status: RESOLVED

