    5. Continuous 15% Greek-Adjusted Loss Ceiling: Exempted HARD_MAX_15PCT_SL and morning catastrophic circuits from Spot SL Guard suppression in position_monitor.py; aligned is_catastrophic_opt to 15% (1.0 - max_loss_pct).
