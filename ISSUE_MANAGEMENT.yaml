  - common/patterns_bear.py
  - common/resolve.py
  - common/display_writer.py
  - common/trading_core.py
  - common/position_monitor.py
  - Trade_Option/index_options_trade_engine.py
  - Trade_Option/stock_options_trade_engine.py
  - input/program_config.json
  resolution: 'Implemented 7 institutional upgrades under a zero-trade-starvation architecture:
    1. Option Contract VWAP Guard: Added calculate_option_vwap() tracking intraday contract VWAP and stretch percentage; integrated soft scoring bonus (+2 for FAIR <=8%, 0 neutral for EXPANDED 8-15%, -2 penalty for STRETCHED >15%) without hard rejection.
    2. Point C TWAP Base Stability: Added calculate_twap_c_stability() evaluating standard deviation of Point C absorption base relative to risk distance (std <= 0.25 * risk); pristine bases qualify setups for Tier 1 Gold / STAGE_A_PLUS_READY.
