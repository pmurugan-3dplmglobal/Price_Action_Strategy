- id: FEATURE-032
  title: Trailed Stop Loss Immunity from Initial Spot SL Guard (Breakeven Lock Integrity)
  severity: HIGH
  category: Risk Management & Trailing SL
  family: EXECUTION_GUARD
  date_reported: '2026-09-01'
  symptom: 'Trades that surged +10% into profit and had their Stop Loss trailed to Breakeven (e.g. BANKNIFTY 57400 CE bought
    @ 937.15, surged to 1114.60, trailed SL to 997.55) failed to exit at Breakeven when the option price pulled back to 920.00
    / 815.00 because SPOT_SL_GUARD continuously suppressed the exit based on the initial morning spot support level (57,087.33,
    400 pts away).

    '
  root_cause: 'SPOT_SL_GUARD in common/position_monitor.py was evaluated on all SL triggers without checking trailing_stage,
    allowing initial sub-entry spot support levels to override active Trailed Breakeven / Trailed Profit Stop Losses.

    '
  affected_files:
  - common/position_monitor.py
  - docs/LIVE_TRADING_EXPERIENCE_PLAYBOOK.md
  - MASTER_DOCUMENTATION.yaml
  - ISSUE_MANAGEMENT.yaml
  resolution: '1. Updated common/position_monitor.py to restrict SPOT_SL_GUARD strictly to initial entry stops (trailing_stage
    == 0 and current_sl < entry_s).

    2. Enforced that whenever a position is TRAILED to Breakeven or Profit (trailing_stage >= 1 or current_sl >= entry_s),
    the Trailed SL executes immediately upon touch, preventing green runner trades from giving back gains into a loss.

    3. Verified 14/14 regression suite tests passed with 100% success.

    '
  status: RESOLVED
- id: ISSUE-054
  title: UTC Cloud System Clock Mismatch Suppressing Stop Loss Evaluations on Remote VMs
  severity: CRITICAL
  category: Timezone & Position Monitoring
  family: EXECUTION_GUARD
  date_reported: '2026-09-03'
  symptom: 'Active positions on Oracle Cloud VM (e.g. FINNIFTY, BANKBARODA, SENSEX) that breached their Stop Loss levels failed to execute automated stop-loss exits during morning and afternoon trading sessions.
    '
  root_cause: 'On cloud Linux VMs configured with UTC system timezone, `dt.now().strftime("%H:%M")` and `dt.now().time()` evaluated to UTC time (e.g., 04:25 UTC when IST is 09:55 AM).
    Because the morning volatility guard checked `now_time_str < "09:45"`, the condition evaluated to True throughout the entire Indian market trading hours (03:45 UTC to 09:45 UTC / 09:15 to 15:15 IST), causing the system to bypass Candle Close SL, Emergency Hard SL, Tick LTP SL, and Hard Max Loss checks until market close.
    '
  affected_files:
  - common/position_monitor.py
  - Trade_Option/app_option_Trade.py
  - Trade_Stock/app_Stock_Trade.py
  - common/websocket_monitor.py
  - Trade_Option/automated_strategy_exporter.py
  - MASTER_DOCUMENTATION.yaml
  - ISSUE_MANAGEMENT.yaml
  resolution: '1. Replaced all system-local `dt.now().strftime("%H:%M")` and `dt.now().time()` calls in SL evaluations and failsafe monitors with IST-normalized `get_ist_now().strftime("%H:%M")` and `get_ist_now().time()`.
    2. Verified on Poovendan Oracle Cloud VM (140.245.197.71) that SL evaluations correctly trigger at 09:45 AM IST.
    3. Deployed and verified 100% test pass on regression suite.
    '
  status: RESOLVED
