# Price Action Trading Strategy — Master Documentation Blueprint (v2.1.0-stable)
# Consolidated Master Reference Blueprint (Single Source of Truth)

meta:
  name: Price Action Unified Strategy System
  version: v2.1.0-stable
  platform: Zerodha Kite Connect API
  architecture: Centralized Shared Core (common/) + Dual Workspaces (Trade_Option & Trade_Stock)
  strategy: Unified ABC Bullish & Bearish Reversal Pattern Engine + Multi-Tiered Market Structure (T1/T2/T3)
  coverage:
    - Index Options (NIFTY, BANKNIFTY, SENSEX)
    - Stock Options (210+ NSE F&O Constituent Equities dynamically discovered)
    - Stock Spot Bullish Reversals (stock_bullish_reversal_scanner.py)
    - Stock Spot Bearish Reversals (stock_bearish_reversal_scanner.py)
    - Multi-Tier Soft Scoring (Tier 1 Gold, Tier 2 Core, Tier 3 Momentum)
    - Timeframe-Aware Institutional Accumulation & Distribution Scoring (Daily/Weekly Base Recognition)
    - EARLY_D_ENTRY (80% Candle Completion with Proportional Volume Validation)
    - Unified Hybrid Dynamic Legs (ATR Volatility Adaptive Scaling + Symbol Overrides)
    - Datta & Minervini Law (Risk Discipline, Outcome Bias Immunity, & Objective D2 Re-Entry Mandate)

architecture:
  diagram: |
    Browser (localhost:5050 / localhost:5051)
      ├── Trade_Option Dashboard (app_option_Trade.py: 5050)
      │     ├── Index Options Engine (index_options_trade_engine.py)
      │     └── Stock Options Engine (stock_options_trade_engine.py)
      └── Trade_Stock Dashboard (app_Stock_Trade.py: 5051)
            ├── Stock Bull Reversal (stock_bullish_reversal_scanner.py)
            └── Stock Bear Reversal (stock_bearish_reversal_scanner.py)
                  │
                  ▼
          Centralized Shared Core (common/)
            ├── trading_core.py (Canonical Re-export Hub)
            ├── swing_detection.py (Unified Hybrid Dynamic Legs & Parabolic Multi-Swing Curve Math)
            ├── trade_db.py (Thread-safe JSON persistence & staging)
            └── dashboard_sl_overrides.py (Shared SL/T1/T2/T3 override read/write)

  directory:
    common:
      paths.py: "Single source of truth for canonical system file paths across engines and dashboards (TRADES_DB, ACTIVE_POSITIONS_DB, SCAN_DISPLAY_*, TOKEN_FILE, etc.)"
      pattern_funnel.py: "Price Action Surveillance Radar & Funnel Manager maintaining 3-tier lifecycle stages (Category A+ Imminent Velocity, Category A Breakout Ready, Category B Anchor Incubator) with sub-15s execution dispatch and thread-safe persistence."
      swing_detection.py: "Institutional-grade Phase 0 Parabolic Multi-Swing Cascade Filter with Unified Hybrid Dynamic Legs (get_adaptive_leg_length, is_parabolic_arch_enhanced, extract_swing_pivots, validate_parabolic_cascade_structure, detect_parabolic_multi_swings) supporting ATR volatility scaling (2-5 bars), symbol overrides, BOS integrity, and terminal base absorption."
      vix_guard.py: "India VIX Macro Regime Gate (60s TTL RAM cache) evaluating normal (<=20.0), elevated (20-25), and extreme (>25.0) market volatility states"
      portfolio_risk.py: "Cross-engine portfolio risk governor enforcing max concurrent positions (6), max daily drawdown limit (-3.0%), and sector caps (max 2 per sector across 235 stocks in registries.py)"
      ema_engine.py: "13 EMA & 44 EMA crossover scanner and display output builder with 6-day monthly option contract rollover rule"
      trading_core.py: "Canonical re-export hub for backward compatibility across all modules."
      trade_db.py: "ACID SQLite WAL database (trades.sqlite3) with JSON backward compatibility, cycle staging, and ghost exit cleanup"
      dashboard_auth.py: "User authentication & access control module (PBKDF2 password hashing, admin/user role hierarchy, approval workflow)"
      daily_trade_journal.py: "Daily trade journal sync & statistical analytics engine (get_trade_journal_analytics: Win Rate %, Profit Factor, PnL by Pattern, Timeframe, Engine, and Outcome)"
      dashboard_sl_overrides.py: "Shared read/write of user-edited SL/T1/T2/T3 overrides (sl_target_overrides.json) used by both dashboards"
    Kite_Access_Token_gen.py: "Zerodha Kite OAuth access token generator CLI (single canonical root-level copy)"
    Trade_Option:
      app_option_Trade.py: "Options Dashboard (port 5050) with 1-Click BUY button on Scan Tab (/api/buy-scanned-trade). Chart modal (/api/get-chart-data) renders direction-aware A-B-C-D markers + benchmark Entry line (A.high/A.low) + benchmark-based SL%/RR."
      index_options_trade_engine.py: "Intraday index options engine (NIFTY, BANKNIFTY, SENSEX with BFO exchange routing)"
      stock_options_trade_engine.py: "Nifty 50 stock options scanner & executor"
      automated_strategy_exporter.py: "Plan 1 Multi-Timeframe Automated Daily Exporter (Index: 3m/5m/15m, Stock Option: 15m/60m)"
      run_export_scheduler_daemon.py: "Background Scheduler Daemon for 10:30 AM, 1:00 PM, and 3:15 PM exports"
    Trade_Stock:
      app_Stock_Trade.py: "Stock Trade Dashboard (port 5051) with 1-Click BUY button on Scan Tab (/api/buy-scanned-trade)"
      stock_bullish_reversal_scanner.py: "Stock Bullish Reversal Scanner & Exporter"
    docs:
      description: "Tactical Knowledge Base, Continuous Learning Playbook, and Architecture Specifications"
      LIVE_TRADING_EXPERIENCE_PLAYBOOK.md: "Continuous Live Trading Experience Playbook and Market Lessons Journal capturing day-by-day execution takeaways, failure root causes (e.g. Option Chart Illusion, Spot 44 EMA Breakdown), and tactical engine enhancements"
      STAGE_0_PARABOLIC_CASCADE_REFERENCE.md: "Mathematical and Price Action specification for Stage 0 Parabolic Decay & Soft Scoring"
      DATTA_27_GROUND_TRUTH_VALIDATION_REPORT.md: "27 Ground Truth Chart Pattern Validation against Datta Rulebook"
      FNO_Scanning_Workflow_Spec.md: "FnO Option Contract Scanning, SL/Target Pre-Computation & Forward-Validation Workflow Specification"
    backtest:
      description: "Official Historical Validation Suite for multi-day option strike backtests, Yahoo/Kite historical candle runners, and simulation engines"
      run_official_option_strike_backtest.py: "Official Multi-day Option Strike & Spot Backtest Runner"
      run_kite_master_backtest.py: "Kite Connect API Historical Multi-day Backtest Suite"
      run_master_backtest.py: "Yahoo Finance / Historical Data Master Backtest Engine"
      backtest_simulation.py: "Parallelized Stock Options & Spot Simulation Engine"
      master_backtest_results.json: "JSON Export of latest master backtest run results"
      test_fetch.py: "Quick Yahoo Finance API candle fetch test script"
      test_option_strike_fetch.py: "Zerodha NFO Option Strike token & candle fetch test script"
      test_spot_scan.py: "Spot & Option pattern scanner verification test script"
    scratch:
      run_full_regression_test.py: "19-test Master Strategy Regression Test Suite (Imports, Auth, Invalidation, Serializers, Chart API, DB Invariants, Paths, Trailed-SL Floor, JS V8, Parabolic Math, Auth, VIX Gate, Option Sizing, Harami Ratio, Debit Spreads, Liquidity Gate, 09:16 AM Reconciler, CVE-1..4 Hardening, Feature 5 Positive Breakeven, B-C Excursion Guards)"
      test_vix_portfolio_volume.py: "47-test Unit Verification Suite (VIX Regimes, Portfolio Caps, 235-Stock Sector Map, BCD Volume Profile, EMA Rollover, IST Timing, Harami Ratios, Bear Date Mapping, Capital Ceilings, Liquidity Shield)"
      test_cve_fixes.py: "6-test Targeted CVE & Feature Verification Suite (CVE-1..4, Feature 5 Positive Breakeven, Hammer/Shooting Star Containment, B-C Excursion Guard)"
      analyze_all_active.py: "Active position metrics analysis utility"
      apply_30m_targets_to_all_active.py: "Batch target updater for active trades"
      audit_targets.py: "Target calculation auditor script"
      check_procs.py: "Python background process checker"
      export_and_exit_all.py: "Bulk trade exit & export helper script"
      read_active_pos.py: "Active position JSON state inspector"

