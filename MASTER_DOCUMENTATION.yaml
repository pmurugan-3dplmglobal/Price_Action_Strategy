# Price Action Trading Strategy — Master Documentation Blueprint (v2.1.0-stable)
# Consolidated Master Reference Blueprint (Single Source of Truth)

meta:
  name: Price Action Unified Strategy System
  version: v2.1.0-stable
  platform: Zerodha Kite Connect API
  architecture: Centralized Shared Core (common/) + Dual Workspaces (Trade_Option & Trade_Stock)
  strategy: Unified ABC Bullish & Bearish Reversal Pattern Engine + Multi-Tiered Market Structure (T1/T2/T3)
  coverage:
    - Index Options (NIFTY, BANKNIFTY, SENSEX via BFO/NFO)
    - Stock Options (210+ NSE F&O Constituent Equities dynamically discovered)
    - Stock Spot Cash Equity Bullish (Long CNC/MIS) & Bearish (Short MIS)
    - Option Contract VWAP +2σ Overpay Guard (calculate_option_vwap)
    - D1/D2 Regime-Aware Spot Confluence (evaluate_spot_confluence)
    - Volatility Contraction Pattern (VCP) Metrics ATR3/ATR14 & TTM Squeeze (calculate_vcp_metrics)
    - Point C TWAP Absorption Stability (calculate_twap_c_stability)
    - Option vs Stock Parity Alignment (Short Cash Equity execution, PnL & SL Invariant)
    - Robust Option Contract Identification (is_option_contract)
    - Datta & Minervini Law (Risk Discipline, Outcome Bias Immunity, & Objective D2 Re-Entry Mandate)

architecture:
  diagram: |
    Browser (localhost:5050 / localhost:5051)
      ├── Trade_Option Dashboard (app_option_Trade.py: 5050)
      │     ├── Index Options Engine (index_options_trade_engine.py)
      │     └── Stock Options Engine (stock_options_trade_engine.py)
      └── Trade_Stock Dashboard (app_Stock_Trade.py: 5051)
            ├── Stock Bull Reversal (stock_bullish_reversal_scanner.py)
            └── Stock Bear Reversal (stock_bearish_reversal_scanner.py)
                  │
                  ▼
          Centralized Shared Core (common/)
            ├── trading_core.py (Canonical Re-export Hub)
            ├── swing_detection.py (Unified Hybrid Dynamic Legs, VCP Metrics, Option VWAP, TWAP C)
            ├── resolve.py (Dynamic Strike Selection, Spot Confluence, Contract Invariants)
            ├── position_monitor.py (Risk Loop, Trailing, Spot SL Guard, Short Equity Exit)
            ├── pattern_funnel.py (Surveillance Radar Lifecycle: A+, A, B)
            ├── trade_db.py (ACID SQLite WAL database trades.sqlite3)
            └── dashboard_sl_overrides.py (Shared SL/T1/T2/T3 override read/write)

  directory:
    common:
      paths.py: "Single source of truth for canonical system file paths across engines and dashboards (TRADES_DB, ACTIVE_POSITIONS_DB, SCAN_DISPLAY_*, TOKEN_FILE, etc.)"
      pattern_funnel.py: "Price Action Surveillance Radar & Funnel Manager maintaining 3-tier lifecycle stages (Category A+ Imminent Velocity, Category A Breakout Ready, Category B Anchor Incubator) with sub-15s execution dispatch."
      swing_detection.py: "Phase 0 Parabolic Multi-Swing Cascade Filter with Unified Hybrid Dynamic Legs, ATR Volatility Adaptive Scaling (2-5 bars), BOS integrity, calculate_vcp_metrics (ATR3/ATR14, TTM Squeeze), calculate_option_vwap (+2σ bands), and calculate_twap_c_stability."
      resolve.py: "Dynamic strike resolution, Option vs Stock domain parity, evaluate_spot_confluence (D1 Reversal vs D2 Continuation), candidate arbitrage scoring, and robust is_option_contract detection."
      position_monitor.py: "Autonomous position surveillance, Spot-Anchored SL Guard, +BE Positive Breakeven lock, 3-tier exit execution, and short cash equity cover execution (BUY MIS at ask * 1.005)."
      vix_guard.py: "India VIX Macro Regime Gate (60s TTL RAM cache) evaluating normal (<=20.0), elevated (20-25), and extreme (>25.0) market volatility states."
      portfolio_risk.py: "Cross-engine portfolio risk governor enforcing dynamic capital-scaled concurrent positions (6 per 100k), max daily drawdown limit (-3.0%), and sector caps (max 2 per sector)."
      ema_engine.py: "13 EMA & 44 EMA crossover scanner and display output builder with 6-day monthly option contract rollover rule."
      trading_core.py: "Canonical re-export hub for backward compatibility across all modules."
      trade_db.py: "ACID SQLite WAL database (trades.sqlite3) with JSON backward compatibility, cycle staging, and ghost exit cleanup."
      dashboard_auth.py: "User authentication & access control module (PBKDF2 password hashing, admin/user role hierarchy, approval workflow)."
      daily_trade_journal.py: "Daily trade journal sync & statistical analytics engine (Win Rate %, Profit Factor, PnL by Pattern, Timeframe, Engine)."
      dashboard_sl_overrides.py: "Shared read/write of user-edited SL/T1/T2/T3 overrides (sl_target_overrides.json) used by both dashboards."
    Kite_Access_Token_gen.py: "Zerodha Kite OAuth access token generator CLI (single canonical root-level copy)."
    Trade_Option:
      app_option_Trade.py: "Options Dashboard (port 5050) with 1-Click BUY button on Scan Tab (/api/buy-scanned-trade), 24/7 position monitor daemon, and TradingView chart modal."
      index_options_trade_engine.py: "Intraday index options engine (NIFTY, BANKNIFTY, SENSEX with BFO exchange routing)."
      stock_options_trade_engine.py: "Full NSE F&O universe options scanner & executor with Fast Surveillance Radar loop."
      automated_strategy_exporter.py: "Plan 1 Multi-Timeframe Automated Daily Exporter (Index: 3m/5m/15m, Stock Option: 15m/60m)."
      run_export_scheduler_daemon.py: "Background Scheduler Daemon for 09:16 AM, 10:30 AM, 1:00 PM, and 3:15 PM exports."
    Trade_Stock:
      app_Stock_Trade.py: "Stock Trade Dashboard (port 5051) with 1-Click BUY/SHORT (MIS) button on Scan Tab (/api/buy-scanned-trade), short stock P&L calculations, and interactive TV chart modal."
      stock_bullish_reversal_scanner.py: "Stock Bullish Reversal Scanner & Exporter."
      stock_bearish_reversal_scanner.py: "Stock Bearish Reversal Scanner & Exporter."
      stock_reversal_scanner.py: "Unified Stock Reversal Scanner engine with direction serialization, VIX/portfolio risk gates, and VCP metrics."
    docs:
      description: "Tactical Knowledge Base, Continuous Learning Playbook, and Architecture Specifications."
      LIVE_TRADING_EXPERIENCE_PLAYBOOK.md: "Live Trading Lessons Journal capturing day-by-day execution takeaways, failure root causes, and tactical enhancements."
      STAGE_0_PARABOLIC_CASCADE_REFERENCE.md: "Mathematical and Price Action specification for Stage 0 Parabolic Decay & Soft Scoring."
      DATTA_27_GROUND_TRUTH_VALIDATION_REPORT.md: "27 Ground Truth Chart Pattern Validation against Datta Rulebook."
      FNO_Scanning_Workflow_Spec.md: "FnO Option Contract Scanning, SL/Target Pre-Computation & Forward-Validation Workflow Specification."
    backtest:
      description: "Official Historical Validation Suite for multi-day option strike backtests, Yahoo/Kite historical runners, and simulation engines."
      run_official_option_strike_backtest.py: "Official Multi-day Option Strike & Spot Backtest Runner."
      run_kite_master_backtest.py: "Kite Connect API Historical Multi-day Backtest Suite."
      run_master_backtest.py: "Yahoo Finance / Historical Data Master Backtest Engine."
      backtest_simulation.py: "Parallelized Stock Options & Spot Simulation Engine."
      master_backtest_results.json: "JSON Export of latest master backtest run results."
    scratch:
      run_full_regression_test.py: "21-test Master Strategy Regression Test Suite (Imports, Auth, Scanners, Serializers, Chart API, DB Invariants, Paths, Trailed-SL Floor, JS V8, Parabolic Math, Auth, VIX Gate, Option Sizing, Harami Ratio, Debit Spreads, Liquidity Gate, 09:16 AM Reconciler, CVE-1..4 Hardening, Feature 5 Positive Breakeven, Funnel Stages, Option vs Stock Parity)."
      test_institutional_enhancements.py: "5-test Institutional Unit Verification Suite (Option VWAP +2σ bands, Point C TWAP stability, Spot Confluence mapping, Continuous 15% Greek loss shield, Pegged limit routing)."
      test_vix_portfolio_volume.py: "47-test Unit Verification Suite (VIX Regimes, Portfolio Caps, Sector Map, BCD Volume Profile, EMA Rollover, IST Timing)."
      test_cve_fixes.py: "6-test Targeted CVE & Feature Verification Suite."

config_precedence:
  priority_1: "Manual UI User Edits (overrides in sl_target_overrides.json & active_positions_db.json)"
  priority_2: "Persistent Config / Stored DB (input/program_config.json, trades.sqlite3)"
  priority_3: "Adaptive Defaults (calculated dynamically based on active timeframe & asset class)"

timeframe_resampling:
  native_kite_tfs: ["minute", "3minute", "5minute", "10minute", "15minute", "30minute", "60minute", "day"]
  resampled_tfs:
    "75min": "Resampled from 15minute candles into 75min bars (5 candles/day: 09:15-10:30, 10:30-11:45, 11:45-13:00, 13:00-14:15, 14:15-15:30) via resample('75min', offset='15min')"
    "4hr": "Resampled from 60minute candles into 240min bars via resample('240min')"
    "week": "Resampled from daily candles into Friday-ending weekly bars via resample('W-FRI')"
  stock_trade_rule: "Trade_Stock scanners default strictly to 'day' candles unless configured via UI/program_config.json"
  supported_stock_tfs: ["day", "week", "4hr", "1hr", "75min", "30min", "15min"]
  adaptive_lookback:
    intraday: "30 - 60 calendar days for 3m/5m/10m/15m/30m"
    hourly: "180 - 365 calendar days for 60m/1hr/75min/4hr"
    daily_weekly: "2000 calendar days for day/1d/week/1w (scans 52-week & multi-year swing targets)"

engines:
  case_a_index_options:
    id: "index"
    name: "Index Options Engine (NIFTY, BANKNIFTY, SENSEX)"
    file: "Trade_Option/index_options_trade_engine.py"
    asset_class: "INDEX_OPTION"
    side: "BULL"
    instruments: ["NIFTY", "BANKNIFTY", "SENSEX"]
    strike_range: "ATM ± 1 strike step (Default: 1, configurable in program_config.json / UI)"
    defaults: {timeframe_entry: "3minute", timeframe_anchor: "15minute", risk_percent: 1.0, capital: 100000}

  case_b_stock_options:
    id: "nifty50"
    name: "Stock Options Trade Engine"
    file: "Trade_Option/stock_options_trade_engine.py"
    asset_class: "STOCK_OPTION"
    side: "BULL / BEAR"
    instruments: "Full NSE F&O Universe (~210+ Liquid Constituent Equities dynamically discovered)"
    strike_range: "ATM ± 1 strike step (Default: 1, configurable in program_config.json / UI)"
    defaults: {target_universe: "FNO_ALL", timeframe_entry: "15minute", timeframe_anchor: "30minute", risk_percent: 10.0, capital: 100000}

  case_c_stock_spot_bull:
    id: "daily"
    name: "Stock_Bullish_Reversal_Scanner"
    file: "Trade_Stock/stock_bullish_reversal_scanner.py"
    asset_class: "STOCK_SPOT"
    side: "BULL"
    instruments: "NSE Liquid Equities (Spot)"
    execution: "Long Cash Equity: BUY CNC/MIS at market/ask; exits via SELL CNC/MIS; SL below entry, targets above entry."
    defaults: {timeframe_entry: "day", timeframe_anchor: "day", lookback_days: 2000}

  case_d_stock_spot_bear:
    id: "bear_trade"
    name: "Stock_Bearish_Reversal_Scanner"
    file: "Trade_Stock/stock_bearish_reversal_scanner.py"
    asset_class: "STOCK_SPOT"
    side: "BEAR"
    instruments: "NSE Liquid Equities (Spot)"
    execution: "Short Cash Equity: SELL MIS at market/bid; exits via BUY MIS at ask * 1.005 to cover short; SL above entry, targets below entry; PnL = ((entry - exit) / entry * 100)."
    defaults: {timeframe_entry: "day", timeframe_anchor: "day", lookback_days: 2000}

  case_e_stock_ema:
    id: "ema_engine"
    name: "Stock EMA Engine (13 EMA / 44 EMA Crossover)"
    file: "common/ema_engine.py"
    asset_class: "STOCK_OPTION / STOCK_SPOT"
    side: "BULL / BEAR"
    instruments: "Nifty 50 Constituent Stocks & Options"
    defaults: {timeframe: "1d", fast_ema: 13, slow_ema: 44, scan_interval: 300}

backtest_suite:
  directory: "backtest/"
  runners:
    official_strike_runner: "backtest/run_official_option_strike_backtest.py"
    kite_historical_runner: "backtest/run_kite_master_backtest.py"
    master_runner: "backtest/run_master_backtest.py"
    simulation_engine: "backtest/backtest_simulation.py"
  output:
    results_json: "backtest/master_backtest_results.json"
    exports_csv: "Trade_Option/output/exports/"
  tests:
    - "backtest/test_fetch.py"
    - "backtest/test_option_strike_fetch.py"
    - "backtest/test_spot_scan.py"

  strategy_rules:
    core_architectural_thumb_rule:
      rule_name: "Feature Isolation & Zero Regression Rule"
      fundamental_principle: "New features or modules MUST be strictly isolated and MUST NEVER alter, degrade, or break existing working functionality."
      enforcement_guidelines:
        - "Engine Separation: Index Options Engine (Trade_Option Port 5050) and Stock Trade Engine (Trade_Stock Port 5051) maintain strict workspace, display, and process isolation."
        - "Default View Integrity: Web UI dashboards default view filters to their corresponding core engine."
        - "Zero Side-Effects: New API endpoints or scanners are verified via regression test suite before release."

    canonical_path_integrity:
      rule_name: "Canonical Path Consolidation (common/paths.py)"
      fundamental_principle: "All modules MUST import file paths from common/paths.py to eliminate CWD-dependent file location splits."

    active_trade_guards:
      rule_name: "Active Trade Invariants & Data Safeguards"
      duplication_guard: "create_trade(..., allow_duplicate=False) rejects duplicate ACTIVE contracts per engine."
      expiry_purge: "purge_expired_positions() automatically clears expired option contracts."
      entry_time_sanitization: "sanitize_entry_time() guarantees entry_time represents true execution timestamp."
      one_click_buy_preservation: "1-Click BUY captures and preserves candle_a_time, benchmark, anchor_floor, and direction while guarding against expired contract purchases."

    swing_filter_rule:
      rule_name: "Phase 0 Parabolic Multi-Swing Cascade & Terminal Base Filter (enable_swing_filter)"
      fundamental_principle: "Requires >= 3 cascading swing waves forming parabolic decay curves (R^2 >= 0.55) and terminal base absorption before Anchor A can form."
      timeframe_scope: "STRICTLY EVALUATED ON ANCHOR TIMEFRAME (df_anchor for options, stock chart for spot)."
      requirements:
        - "Polynomial Regression: Fits y = ax^2 + bx + c requiring concave down dome (a < 0) for Bullish and concave up cup (a > 0) for Bearish with R^2 >= 0.55."
        - "Cascade Progression: Extrema of each wave progressively decay (Lower Highs + Lower Lows for Bullish setups)."
        - "Confirmed Break of Structure (BOS): Each subsequent wave leg down must have confirmed candle close below prior structural low (start_val)."
        - "Point 4 Terminal Base: Identifies flat consolidation / base absorption at Point 4 (pct_diff < 2%)."
        - "Recency Constraint (max_bars_after_terminal): Terminal swing base must be recent (<= 45 bars across Daily and Options charts)."
        - "Sequential Trigger: Anchor Candle A formed within terminal base window (Anchor_idx >= Terminal_idx - 5 bars lookback)."

    anchor_selection_and_invalidation:
      rule_name: "Universal Anchor Validity & Activity Rule (is_anchor_valid_and_active)"
      anchor_selection: "Scanners must select the NEWEST (most recent) valid Anchor candle in the chart."
      timeframe_scope: "STRICTLY SPECIFIC TO ANCHOR TIMEFRAME (df_anchor). Evaluated exclusively on candles of timeframe_anchor."
      invalidation_conditions:
        - "SL Violation: Discard setup if any subsequent candle on df_anchor closed below SL (closing basis for Bull, above SL for Bear)."
        - "Target 1 (80%+ Exhaustion): Discard setup if any subsequent candle achieved >= 80% of move to T1 or touched 100% of T1."
        - "T1 to T2 Gap Constraint: If 80%/100% T1 reached, setup is discarded unless T2 is available with >= 10.0% expansion gap over T1."
        - "Target 2 Pre-Hit: Discard setup if subsequent candles touched or exceeded T2."

    target_derivation_and_timeframes:
      default_anchor_tf: "Nifty 50 Stock Options & Spot default to 30minute (timeframe_entry='30minute', timeframe_anchor='30minute'). Index Options default to 15minute."
      derivation_method: "All profit targets (T1, T2, T3) are derived strictly from df_anchor candles using Negation Theory (find_profit_targets / find_profit_targets_bearish)."
      target_buffers:
        cheap_options: "Price <= 50: Early exit buffer = max(0.50, Target * 1.5%)"
        mid_options: "Price 50-200: Early exit buffer = max(1.00, Target * 1.5%)"
        spots_high_options: "Price > 200: Early exit buffer = max(2.00, Target * 1.0%)"
      missing_targets_exit_rule: "If T2/T3 are N/A (None), reaching T1 minus early exit buffer triggers a 100% full position exit."

    pattern_priority:
      - "1. Bullish Engulfing / Bearish Engulfing (ABCD)"
      - "2. Lower Low (LL) Sweep / Higher High (HH) Sweep"
      - "3. Two Higher Highs / Two Lower Lows"
      - "4. Baby Candle / Shooting Star (Hammer)"
      - "5. Bullish Harami / Bearish Harami"
      - "Rule: First valid pattern matching R:R >= 1.88 triggers setup."

    risk_management:
      check_interval: "Every 2-5 seconds / WebSocket heartbeat daemon"
      portfolio_risk_drawdown: "Max Daily Drawdown evaluates combined realized loss + active unrealized floating loss across all positions against -3.0% capital threshold."
      cash_equity_capital_cap: "Cash equity position sizing strictly caps units to 100% of available capital to eliminate excessive leverage exposure on micro stop losses."
      vix_regime_governance: "India VIX regime gates entries: Normal (<=20.0) permits all tiers, Elevated (20-25) permits Tier 1 Gold only, Extreme (>25.0) halts all new entries."
      friday_eod_index_squareoff: "On Fridays at 15:15 IST, all short-timeframe (<= 5m) or Index option positions are automatically squared off (EXIT_EOD_FRIDAY) to eliminate weekend theta decay."
      expiry_rollover_protection: "Stock options in monthly expiry week (days_rem <= 6) automatically roll over to next monthly series (expiries[1]). Index options preserve active weekly near-expiry."
      stale_outlier_entry_guard: "Positions with >300% divergence between entry_spot and live LTP are protected from false immediate Emergency Hard SL triggers."
      stages:
        sl_hit: "Exit full position (EXIT_SL)"
        t1_hit: "Move SL to Positive Breakeven (+BE: Entry + 2% Bull, Entry - 2% Bear), or FULL EXIT if T2/T3 are N/A"
        t2_hit: "Move SL to T1 level (TRAIL_T1)"
        t3_hit: "Exit full position (EXIT_T3)"
      setup_classification:
        fresh_entry: "HIGH_PRIORITY: Post-D candles have not hit T1 or SL yet. SL at original A.low buffer."
        t2_continuation: "LOW_PRIORITY: Post-D candles ALREADY hit T1, but T2/T3 is pending. SL trailed to T1 level."
        expired: "REJECTED: Post-D candles closed below SL OR completed all targets (T3)."
      exit_order_execution_tiers:
        tier_1: "Marketable LIMIT Order at 0.995 * Bid/LTP (rounded to 0.05 tick) for instant fills."
        tier_2: "Aggressive LIMIT Order at 0.980 * Bid/LTP if primary limit order is rejected or unfulfilled."
        tier_3: "Emergency MARKET Order execution if marketable limit fails to guarantee 100% position closure."

  bullish_patterns:
    - id: 1
      name: "Bullish Engulfing (A-B-C-D)"
      anchor: "Bullish candle wrapping prior bearish candle body+wick"
      breakout: "Close > A.high"
      retest: "Low <= A.high AND Close > A.low"
      confirmation: "Close > A.high"
      sl: "A.low - buffer"
      targets: "Negation theory non-negated swing high resistance levels T1, T2, T3"
    - id: 2
      name: "Lower Low (LL) Sweep (ABCD)"
      anchor: "Two-leg swing sweep: Low 1 base -> intermediate swing rally (>= 0.8x ATR or >= 1.5%) holding above Low 1 -> Low 2 sweep dips below Low 1 -> Bullish bounce candle recovers & closes above sweep high"
      breakout: "Close > B.high"
      sl: "Sweep Candle Low (Low 2) - buffer"
      swing_rule: "Enforces distinct intermediate rally to eliminate 1-leg waterfall traps"
    - id: 3
      name: "Two Higher Highs"
      anchor: "Two successive higher-high bullish candles (A1, A2)"
      sl: "Min(A1.low, A2.low) - buffer"
    - id: 4
      name: "Baby Candle / Pinbar / Hammer"
      anchor: "Small baby/hammer candle inside bearish mother body with lower wick and base containment"
      sl: "Baby Low - buffer"
    - id: 5
      name: "Bullish Harami (Inside Bar)"
      anchor: "Bullish inside bar inside bearish mother candle body (Inside Body <= 65% Mother Body)"
      sl: "Inside Low - buffer"

  bearish_patterns:
    - id: 1
      name: "Bearish Engulfing (A-B-C-D)"
      anchor: "Bearish candle wrapping prior bullish candle body+wick"
      breakout: "Close < A.low"
      retest: "High >= A.low AND Close < A.high"
      confirmation: "Close < A.low"
      sl: "A.high + buffer"
      targets: "Negation theory non-negated swing low support levels T1, T2, T3"
    - id: 2
      name: "Higher High (HH) Sweep (ABCD)"
      anchor: "Two-leg swing sweep: High 1 base -> intermediate swing pullback (<= High 1 - 0.8x ATR or >= 1.5%) holding below High 1 -> High 2 sweep rallies above High 1 -> Bearish rejection candle closes back below sweep low"
      breakout: "Close < B.low"
      sl: "Sweep Candle High (High 2) + buffer"
      swing_rule: "Enforces distinct intermediate pullback to eliminate 1-leg climax traps"
    - id: 3
      name: "Two Lower Lows"
      anchor: "Two successive lower-low bearish candles (A1, A2)"
      sl: "Max(A1.high, A2.high) + buffer"
    - id: 4
      name: "Shooting Star / Bearish Baby Candle"
      anchor: "Small shooting star/baby candle inside bullish mother body with upper wick and peak containment"
      sl: "Baby High + buffer"
    - id: 5
      name: "Bearish Harami (Inside Bar)"
      anchor: "Bearish inside bar inside bullish mother candle body (Inside Body <= 65% Mother Body)"
      sl: "Inside High + buffer"

