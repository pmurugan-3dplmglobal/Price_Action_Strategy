# Price Action Trading Strategy — Master Documentation Blueprint (v2.1.0-stable)
# Consolidated Master Reference Blueprint (Single Source of Truth)

meta:
  name: Price Action Unified Strategy System
  version: v2.1.0-stable
  platform: Zerodha Kite Connect API
  architecture: Centralized Shared Core (common/) + Dual Workspaces (Trade_Option & Trade_Stock)
  strategy: Unified ABC Bullish & Bearish Reversal Pattern Engine + Multi-Tiered Market Structure (T1/T2/T3)
  coverage:
    - Index Options (NIFTY, BANKNIFTY, SENSEX)
    - Stock Options (210+ NSE F&O Constituent Equities dynamically discovered)
    - Stock Spot Bullish Reversals (stock_bullish_reversal_scanner.py)
    - Stock Spot Bearish Reversals (stock_bearish_reversal_scanner.py)
    - Multi-Tier Soft Scoring (Tier 1 Gold, Tier 2 Core, Tier 3 Momentum)
    - EARLY_D_ENTRY (80% Candle Completion with Proportional Volume Validation)
    - Unified Hybrid Dynamic Legs (ATR Volatility Adaptive Scaling + Symbol Overrides)

architecture:
  diagram: |
    Browser (localhost:5050 / localhost:5051)
      ├── Trade_Option Dashboard (app_option_Trade.py: 5050)
      │     ├── Index Options Engine (index_options_trade_engine.py)
      │     └── Stock Options Engine (stock_options_trade_engine.py)
      └── Trade_Stock Dashboard (app_Stock_Trade.py: 5051)
            ├── Stock Bull Reversal (stock_bullish_reversal_scanner.py)
            └── Stock Bear Reversal (stock_bearish_reversal_scanner.py)
                  │
                  ▼
          Centralized Shared Core (common/)
            ├── trading_core.py (Canonical Re-export Hub)
            ├── swing_detection.py (Unified Hybrid Dynamic Legs & Parabolic Multi-Swing Curve Math)
            ├── trade_db.py (Thread-safe JSON persistence & staging)
            └── dashboard_sl_overrides.py (Shared SL/T1/T2/T3 override read/write)

  directory:
    common:
      paths.py: "Single source of truth for canonical system file paths across engines and dashboards (TRADES_DB, ACTIVE_POSITIONS_DB, SCAN_DISPLAY_*, TOKEN_FILE, etc.)"
      swing_detection.py: "Institutional-grade Phase 0 Parabolic Multi-Swing Cascade Filter with Unified Hybrid Dynamic Legs (get_adaptive_leg_length, is_parabolic_arch_enhanced, extract_swing_pivots, validate_parabolic_cascade_structure, detect_parabolic_multi_swings) supporting ATR volatility scaling (2-5 bars), symbol overrides, BOS integrity, and terminal base absorption."
      ema_engine.py: "13 EMA & 44 EMA crossover scanner and display output builder for options (5050) and stock spot (5051) modes"
      trading_core.py: "Canonical re-export hub for backward compatibility across all modules."
      trade_db.py: "Thread-safe JSON trade database, cycle staging, duplicate active position rejection, expired position purging, and executed pattern deduplication"
      dashboard_auth.py: "User authentication & access control module (PBKDF2 password hashing, admin/user role hierarchy, approval workflow)"
      dashboard_sl_overrides.py: "Shared read/write of user-edited SL/T1/T2/T3 overrides (sl_target_overrides.json) used by both dashboards"
    Kite_Access_Token_gen.py: "Zerodha Kite OAuth access token generator CLI (single canonical root-level copy)"
    Trade_Option:
      app_option_Trade.py: "Options Dashboard (port 5050) with 1-Click BUY button on Scan Tab (/api/buy-scanned-trade). Chart modal (/api/get-chart-data) renders direction-aware A-B-C-D markers + benchmark Entry line (A.high/A.low) + benchmark-based SL%/RR."
      index_options_trade_engine.py: "Intraday index options engine (NIFTY, BANKNIFTY, SENSEX with BFO exchange routing)"
      stock_options_trade_engine.py: "Nifty 50 stock options scanner & executor"
      automated_strategy_exporter.py: "Plan 1 Multi-Timeframe Automated Daily Exporter (Index: 3m/5m/15m, Stock Option: 15m/60m)"
      run_export_scheduler_daemon.py: "Background Scheduler Daemon for 10:30 AM, 1:00 PM, and 3:15 PM exports"
    Trade_Stock:
      app_Stock_Trade.py: "Stock Trade Dashboard (port 5051) with 1-Click BUY button on Scan Tab (/api/buy-scanned-trade)"
      stock_bullish_reversal_scanner.py: "Stock Bullish Reversal Scanner & Exporter"
      stock_bearish_reversal_scanner.py: "Stock Bearish Reversal Scanner & Exporter"
    backtest:
      description: "Official Historical Validation Suite for multi-day option strike backtests, Yahoo/Kite historical candle runners, and simulation engines"
      run_official_option_strike_backtest.py: "Official Multi-day Option Strike & Spot Backtest Runner"
      run_kite_master_backtest.py: "Kite Connect API Historical Multi-day Backtest Suite"
      run_master_backtest.py: "Yahoo Finance / Historical Data Master Backtest Engine"
      backtest_simulation.py: "Parallelized Stock Options & Spot Simulation Engine"
      master_backtest_results.json: "JSON Export of latest master backtest run results"
      test_fetch.py: "Quick Yahoo Finance API candle fetch test script"
      test_option_strike_fetch.py: "Zerodha NFO Option Strike token & candle fetch test script"
      test_spot_scan.py: "Spot & Option pattern scanner verification test script"
    scratch:
      description: "Temporary Diagnostic Scripts & Re-usable Maintenance Utilities for debug, audit, process checking, and batch target updates"
      analyze_all_active.py: "Active position metrics analysis utility"
      apply_30m_targets_to_all_active.py: "Batch target updater for active trades"
      audit_targets.py: "Target calculation auditor script"
      check_procs.py: "Python background process checker"
      export_and_exit_all.py: "Bulk trade exit & export helper script"
      read_active_pos.py: "Active position JSON state inspector"

config_precedence:
  priority_1: "Manual UI User Edits (overrides in sl_target_overrides.json & active_positions_db.json)"
  priority_2: "Persistent Config / Stored DB (input/program_config.json, trades_db.json)"
  priority_3: "Adaptive Defaults (calculated dynamically based on active timeframe & asset class)"

timeframe_resampling:
  native_kite_tfs: ["minute", "3minute", "5minute", "10minute", "15minute", "30minute", "60minute", "day"]
  resampled_tfs:
    "75min": "Resampled from 15minute candles into 75min bars (5 candles/day: 09:15-10:30, 10:30-11:45, 11:45-13:00, 13:00-14:15, 14:15-15:30) using Pandas resample('75min', offset='15min')"
    "4hr": "Resampled from 60minute candles into 240min bars using Pandas resample('240min')"
    "week": "Resampled from daily candles into Friday-ending weekly bars using Pandas resample('W-FRI')"
  stock_trade_rule: "Trade_Stock scanners default strictly to 'day' candles unless configured via UI/program_config.json"
  supported_stock_tfs: ["day", "week", "4hr", "1hr", "75min", "30min", "15min"]
  adaptive_lookback:
    intraday: "30 - 60 calendar days for 3m/5m/10m/15m/30m"
    hourly: "180 - 365 calendar days for 60m/1hr/75min/4hr"
    daily_weekly: "2000 calendar days for day/1d/week/1w (scans 52-week & multi-year swing targets)"

engines:
  case_a_index_options:
    id: "index"
    name: "Index Options Engine (NIFTY, BANKNIFTY, SENSEX)"
    file: "Trade_Option/index_options_trade_engine.py"
    asset_class: "INDEX_OPTION"
    side: "BULL"
    instruments: ["NIFTY", "BANKNIFTY", "SENSEX"]
    strike_range: "ATM ± X strikes (Default: 0, configurable in program_config.json / UI)"
    defaults: {timeframe_entry: "3minute", timeframe_anchor: "15minute", risk_percent: 1.0, capital: 100000}

  case_b_stock_options:
    id: "nifty50"
    name: "Stock Options Trade Engine"
    file: "Trade_Option/stock_options_trade_engine.py"
    asset_class: "STOCK_OPTION"
    side: "BULL / BEAR"
    instruments: "Full NSE F&O Universe (~210+ Liquid Constituent Equities)"
    strike_range: "ATM ± X strikes (Default: 0, configurable in program_config.json / UI)"
    defaults: {target_universe: "FNO_ALL", timeframe_entry: "15minute", timeframe_anchor: "30minute", risk_percent: 10.0, capital: 100000}

  case_c_stock_spot_bull:
    id: "daily"
    name: "Stock_Bullish_Reversal_Scanner"
    file: "Trade_Stock/stock_bullish_reversal_scanner.py"
    asset_class: "STOCK_SPOT"
    side: "BULL"
    instruments: "Nifty 50 Constituent Stocks (Spot)"
    defaults: {timeframe_entry: "day", timeframe_anchor: "day", lookback_days: 2000}

  case_d_stock_spot_bear:
    id: "bear_trade"
    name: "Stock_Bearish_Reversal_Scanner"
    file: "Trade_Stock/stock_bearish_reversal_scanner.py"
    asset_class: "STOCK_SPOT"
    side: "BEAR"
    instruments: "Nifty 50 Constituent Stocks (Spot)"
    defaults: {timeframe_entry: "day", timeframe_anchor: "day", lookback_days: 2000}

  case_e_stock_ema:
    id: "ema_engine"
    name: "Stock EMA Engine (13 EMA / 44 EMA Crossover)"
    file: "common/ema_engine.py"
    asset_class: "STOCK_OPTION / STOCK_SPOT"
    side: "BULL / BEAR"
    instruments: "Nifty 50 Constituent Stocks & Options"
    defaults: {timeframe: "1d", fast_ema: 13, slow_ema: 44, scan_interval: 300}

backtest_suite:
  directory: "backtest/"
  runners:
    official_strike_runner: "backtest/run_official_option_strike_backtest.py"
    kite_historical_runner: "backtest/run_kite_master_backtest.py"
    master_runner: "backtest/run_master_backtest.py"
    simulation_engine: "backtest/backtest_simulation.py"
  output:
    results_json: "backtest/master_backtest_results.json"
    exports_csv: "Trade_Option/output/exports/"
  tests:
    - "backtest/test_fetch.py"
    - "backtest/test_option_strike_fetch.py"
    - "backtest/test_spot_scan.py"

  strategy_rules:
    core_architectural_thumb_rule:
      rule_name: "Non-Negotiable Architecture Thumb Rule: Feature Isolation & Zero Regression"
      fundamental_principle: "New features, modules, or tools (e.g. Negation Analyzer, Exporters) MUST be strictly isolated and MUST NEVER alter, degrade, or break existing working functionality."
      enforcement_guidelines:
        - "Engine Separation: Index Options Engine (index_options_trade_engine.py / app_option_Trade.py) and Stock Options Engine (stock_options_trade_engine.py / app_Stock_Trade.py) must maintain clear workspace and display isolation."
        - "Default View Integrity: Web UI dashboards must default their view filters to their corresponding core engine (Index Dashboard defaults to 'Index', Stock Dashboard defaults to 'Nifty 50')."
        - "Independent Testing: Any new API endpoint or scanner tool must be tested in isolation to verify zero side-effects on active trade execution, position recovery, and display files."

    canonical_path_integrity:
      rule_name: "Canonical Path Consolidation (common/paths.py)"
      fundamental_principle: "All modules MUST import file paths from common/paths.py to eliminate CWD-dependent file location splits."
      enforcement_guidelines:
        - "All engines, scanners, dashboards, and background processes must resolve output paths via common/paths.py."
        - "Guarantees zero path split-brain bugs between root and workspace-relative directories."

    active_trade_guards:
      rule_name: "Active Trade Invariants & Data Safeguards"
      duplication_guard: "create_trade(..., allow_duplicate=False) rejects duplicate ACTIVE contracts per engine."
      expiry_purge: "purge_expired_positions() automatically clears expired option contracts."
      entry_time_sanitization: "sanitize_entry_time() guarantees entry_time represents the true execution timestamp to prevent pre-buy candle evaluation errors."
      one_click_buy_preservation: "1-Click BUY captures and preserves candle_a_time, benchmark, anchor_floor, and direction while guarding against expired contract purchases."

    swing_filter_rule:
      rule_name: "Phase 0 Parabolic Multi-Swing Cascade & Terminal Base Filter (enable_swing_filter)"
      fundamental_principle: "Requires >= 3 cascading swing waves forming parabolic decay curves (R^2 >= 0.55) and terminal base absorption before Anchor A can form."
      timeframe_scope: "STRICTLY EVALUATED ON ANCHOR TIMEFRAME (df_anchor for options, stock chart for spot)."
      requirements:
        - "Polynomial Regression: Fits y = ax^2 + bx + c requiring concave down dome (a < 0) for Bullish and concave up cup (a > 0) for Bearish with R^2 >= 0.55."
        - "Cascade Progression: Extrema of each wave must progressively decay (Lower Highs + Lower Lows for Bullish setups)."
        - "Confirmed Break of Structure (BOS): Each subsequent wave leg down must have a confirmed candle close below the prior structural low (start_val)."
        - "Point 4 Terminal Base: Identifies flat consolidation / base absorption at Point 4 (pct_diff < 2%)."
        - "Recency Constraint (max_bars_after_terminal): Terminal swing base must be recent (<= 45 bars across Daily and Options charts)."
        - "Sequential Trigger: Anchor Candle A formed within terminal base window (Anchor_idx >= Terminal_idx - 5 bars lookback)."

    anchor_selection_and_invalidation:
      rule_name: "Universal Anchor Validity & Activity Rule (is_anchor_valid_and_active)"
      anchor_selection: "Scanners must select the NEWEST (most recent) valid Anchor candle in the chart."
      timeframe_scope: "STRICTLY SPECIFIC TO ANCHOR TIMEFRAME (df_anchor). Evaluated exclusively on candles of timeframe_anchor."
      invalidation_conditions:
        - "SL Violation: Discard setup if any subsequent candle on df_anchor closed below SL (closing basis)."
        - "Target 1 Pre-Hit: Discard setup if any subsequent candle on df_anchor touched T1 (high price >= T1)."
      generic_enforcement: "Applied universally across stock_options_trade_engine.py, index_options_trade_engine.py, scan_anchor_bcd_breakout(), scan_symbol(), and UI APIs."

    target_derivation_and_timeframes:
      default_anchor_tf: "Nifty 50 Stock Options & Spot default strictly to 30minute (Same Entry & Anchor TF: timeframe_entry='30minute', timeframe_anchor='30minute'). Index Options default to 15minute."
      derivation_method: "All profit targets (T1, T2, T3) are derived strictly from df_anchor candles using Negation Theory (find_profit_targets / find_profit_targets_bearish)."
      target_buffers:
        cheap_options: "Price <= 50: Early exit buffer = max(0.50, Target * 1.5%)"
        mid_options: "Price 50-200: Early exit buffer = max(1.00, Target * 1.5%)"
        spots_high_options: "Price > 200: Early exit buffer = max(2.00, Target * 1.0%)"
      missing_targets_exit_rule: "If T2/T3 are N/A (None), reaching T1 minus early exit buffer triggers a 100% full position exit."

    pattern_priority:
      - "1. Bullish Engulfing / Bearish Engulfing (ABCD)"
      - "2. Lower Low (LL) Sweep / Higher High (HH) Sweep"
      - "3. Two Higher Highs / Two Lower Lows"
      - "4. Baby Candle / Shooting Star"
      - "5. Bullish Harami / Bearish Harami"
      - "Rule: First valid pattern matching R:R >= 1.88 triggers setup."

    risk_management:
      check_interval: "Every 5 seconds / WebSocket heartbeat daemon"
      friday_eod_index_squareoff: "On Fridays (weekday == 4) at 15:15 IST, all short-timeframe (<= 5m) or Index option positions are automatically squared off (EXIT_EOD_FRIDAY) to eliminate 2-day weekend theta decay and Monday opening gap risk."
      expiry_rollover_protection: "Stock options in monthly expiry week (days_rem <= 6) automatically roll over to the next monthly series (expiries[1]) to eliminate terminal gamma/theta risk. Index options preserve active weekly near-expiry."
      stale_outlier_entry_guard: "Positions with >300% divergence between entry_spot and live LTP (or manual overrides) are protected from false immediate Emergency Hard SL triggers."
      stages:
        sl_hit: "Exit full position (EXIT_SL)"
        t1_hit: "Move SL to Entry / Breakeven (TRAIL_BE), or FULL EXIT if T2/T3 are N/A"
        t2_hit: "Move SL to T1 level (TRAIL_T1)"
        t3_hit: "Exit full position (EXIT_T3)"
      setup_classification:
        fresh_entry: "HIGH_PRIORITY: Post-D candles have not hit T1 or SL yet. SL at original A.low buffer."
        t2_continuation: "LOW_PRIORITY: Post-D candles ALREADY hit T1, but T2/T3 is still pending and unreached. SL trailed to T1 level."
        expired: "REJECTED: Post-D candles closed below SL OR completed all targets (T3)."
      exit_order_execution_tiers:
        tier_1: "Marketable LIMIT Order at 0.995 * Bid/LTP (rounded to 0.05 tick) for instant fills."
        tier_2: "Aggressive LIMIT Order at 0.980 * Bid/LTP if primary limit order is rejected or unfulfilled."
        tier_3: "Emergency MARKET Order execution if marketable limit fails to guarantee 100% position closure."

  bullish_patterns:
    - id: 1
      name: "Bullish Engulfing (A-B-C-D)"
      anchor: "Bullish candle wrapping prior bearish candle body+wick"
      breakout: "Close > A.high"
      retest: "Low <= A.high AND Close > A.low"
      confirmation: "Close > A.high"
      sl: "A.low - buffer"
      targets: "Negation theory non-negated swing high resistance levels T1, T2, T3"
    - id: 2
      name: "Lower Low (LL) Sweep (ABCD)"
      anchor: "Two-leg swing sweep: Low 1 base -> intermediate swing rally (>= 0.8x ATR or >= 1.5%) across >= 3 candles holding above Low 1 -> Low 2 sweep dips below Low 1 -> Bullish bounce candle recovers & closes above sweep high"
      breakout: "Close > B.high"
      sl: "Sweep Candle Low (Low 2) - buffer"
      swing_rule: "Enforces distinct intermediate rally to eliminate 1-leg waterfall/flat chop traps (FEATURE-014)"
    - id: 3
      name: "Two Higher Highs"
      anchor: "Two successive higher-high bullish candles (A1, A2)"
      sl: "Min(A1.low, A2.low) - buffer"
    - id: 4
      name: "Baby Candle / Pinbar / Hammer"
      anchor: "Small baby/hammer candle inside bearish mother body with lower wick"
      sl: "Baby Low - buffer"
    - id: 5
      name: "Bullish Harami (Inside Bar)"
      anchor: "Bullish inside bar inside bearish mother candle body"
      sl: "Inside Low - buffer"

  bearish_patterns:
    - id: 1
      name: "Bearish Engulfing (A-B-C-D)"
      anchor: "Bearish candle wrapping prior bullish candle body+wick"
      breakout: "Close < A.low"
      retest: "High >= A.low AND Close < A.high"
      confirmation: "Close < A.low"
      sl: "A.high + buffer"
      targets: "Negation theory non-negated swing low support levels T1, T2, T3"
    - id: 2
      name: "Higher High (HH) Sweep (ABCD)"
      anchor: "Two-leg swing sweep: High 1 base -> intermediate swing pullback (<= High 1 - 0.8x ATR or >= 1.5%) across >= 3 candles holding below High 1 -> High 2 sweep rallies above High 1 -> Bearish rejection candle closes back below sweep low"
      breakout: "Close < B.low"
      sl: "Sweep Candle High (High 2) + buffer"
      swing_rule: "Enforces distinct intermediate pullback to eliminate 1-leg climax spike/flat chop traps (FEATURE-014)"
    - id: 3
      name: "Two Lower Lows"
      anchor: "Two successive lower-low bearish candles (A1, A2)"
      sl: "Max(A1.high, A2.high) + buffer"
    - id: 4
      name: "Shooting Star / Bearish Baby Candle"
      anchor: "Small shooting star/baby candle inside bullish mother body with upper wick"
      sl: "Baby High + buffer"
    - id: 5
      name: "Bearish Harami (Inside Bar)"
      anchor: "Bearish inside bar inside bullish mother candle body"
      sl: "Inside High + buffer"

registries:
  indices:
    NIFTY: {token: 256265, lot_size: 65, strike_step: 50, exchange: "NFO"}
    BANKNIFTY: {token: 260105, lot_size: 30, strike_step: 100, exchange: "NFO"}
    SENSEX: {token: 265, lot_size: 20, strike_step: 100, exchange: "BFO"}
  stocks:
    count: 50
    constituents: "All 50 Nifty 50 stocks with auto-sync from Zerodha NSE instrument master"

deployment:
  cloud_provider: "Oracle Cloud Always Free (4 ARM cores, 24GB RAM, Ubuntu 24.04)"
  ports:
    options_dashboard: 5050
    stock_dashboard: 5051

pattern_shorthands:
  description: "Explicit pattern codes used in UI Dashboard table & CSV Export to prevent ambiguity between Bullish and Bearish setups"
  bullish_patterns:
    BULL_2HH: "Two Higher Highs Bullish Setup (BULL_A_Two_Higher_Highs)"
    BULL_LL: "Lower Low Sweep Bullish Setup (BULL_A_LL_Sweep_Var2)"
    BULL_ENG: "Bullish Engulfing Setup (BULL_A_ABCD_Engulf)"
    BULL_HAM: "Baby Candle / Hammer Setup (BULL_A_Baby_Candle)"
    BULL_HAR: "Bullish Harami Setup (BULL_A_Bullish_Harami)"
    BULL_BASE: "Base ABCD Breakout Setup (BASE_ABCD)"
  bearish_patterns:
    BEAR_HH: "Higher High Sweep Bearish Reversal (find_anchor_hh_sweep)"
    BEAR_2LL: "Two Lower Lows Bearish Setup (find_anchor_two_lower_lows)"
    BEAR_ENG: "Bearish Engulfing Setup (find_anchor_bearish_engulfing)"
    BEAR_STAR: "Shooting Star / Bearish Baby Setup (find_anchor_shooting_star_baby)"
    BEAR_HAR: "Bearish Harami Setup (find_anchor_bearish_harami)"
  csv_export_alignment: "CSV exports match UI display table 1-to-1 in column order, numeric rounding (2 decimal places), formatted DD-MM-YY HH:MM timestamps, Yes/No CarryForward, and explicit pattern shorthands"

scan_display_anchor_fields:
  description: "Engine-persisted anchor fields on every staged trade / position so the chart modal mirrors the engine's confirmed setup exactly"
  benchmark: "Breakout threshold = A.high for CE/BULL, A.low for PE/BEAR. Chart Entry price line draws here (label 'Entry (A.high)' / 'Entry (A.low)')."
  anchor_floor: "Sequence-integrity floor = A.low for BULL, A.high for BEAR. Breach triggers the chart 'Seq broken' marker."
  direction: "\"BULL\" or \"BEAR\". Drives direction-aware A-B-C-D marker detection (BEAR is a mirrored mirror: B = Close < A.low, C = retest holding below A.high, D = red Close < A.low)."
  flow: "scan_anchor_bcd_breakout / _bearish -> scan_symbol -> write_scan_display_data.build_trade -> staged JSON -> dashboard chart modal. Position dicts (incl. KITE_RECOVERED) persist them too."
  chart_risk_math: "SL% / T1 RR / footer R:R computed against the benchmark (not the actual entry) for strategy-consistent risk math."
  golden_rule: "UI MUST NOT re-derive A.high/A.low from candle_a_time (anchor detectors may return a different candle than the engine's a_idx benchmark). The engine's persisted benchmark is the single source of truth."

sl_buffer_scaling:
  description: "Dynamic asset & price-tiered Stop Loss buffer (calculate_sl_buffer) providing robust breathing room across option and equity price tiers"
  tiers:
    ultra_cheap_options: "Price < ₹10: max(0.40, Price * 10%)  (guarantees 0.40 - 0.90 pt buffer to absorb bid-ask spread and noise)"
    cheap_options: "₹10 <= Price < ₹50: max(0.60, Price * 4%)  (0.60 - 2.00 pt buffer)"
    mid_options: "₹50 <= Price < ₹200: max(1.00, Price * 2%)"
    high_options_stock: "₹200 <= Price < ₹500: max(1.50, Price * 1.5%)"
    index_spot_high_stocks: "Price >= ₹500: max(2.50, Price * 0.5%)"

multi_tiered_scoring:
  description: "Stage 0 Soft Priority Multi-Tier Model (Proposal C) classifying trade conviction based on parabolic curve decay and price action"
  tiers:
    tier_1_gold:
      badge: "🥇 T1"
      label: "TIER_1_GOLD"
      criteria: "5 True Anchors + (>= 3 Parabolic Waves or Tier 1 Arch) + Terminal Base Absorption + A-B-C-D Confirmation + R:R >= 2.00 (1:2)"
      sizing: "100% Standard Capital"
    tier_2_core:
      badge: "🥈 T2"
      label: "TIER_2_CORE"
      criteria: "5 True Anchors (>= 2 Waves / R:R >= 1.50) OR High-Conviction BASE_ABCD (>= 3 Waves + R:R >= 2.00) (1:1.5)"
      sizing: "70% Standard Capital"
    tier_3_momentum:
      badge: "🥉 T3"
      label: "TIER_3_MOMENTUM"
      criteria: "Standard BASE_ABCD / Page 16/17 Trend Continuation / Immediate Re-Entry / 1-Wave Pullback + R:R >= 1.50"
      sizing: "50% Standard Capital"
  reference_document: "docs/STAGE_0_PARABOLIC_CASCADE_REFERENCE.md"

directional_hegemony_and_arbitrage:
  description: "3-Layer Directional Hegemony & Mutual Exclusivity Engine eliminating opposing CE/PE conflicts on the same symbol"
  layers:
    layer_1_spot_macro_trend:
      rule: "Underlying Spot 13 EMA Trend Filter"
      mechanics: "Calculates 13 EMA on Spot candles. If Spot >= 13 EMA -> Macro Bias is BULL (Favor CE). If Spot < 13 EMA -> Macro Bias is BEAR (Favor PE)."
    layer_2_conviction_arbitrage:
      rule: "Single-Setup Dominant Conviction Arbitrage"
      mechanics: "Collects all matching strike candidates for a symbol, filters by Spot Macro Bias, and ranks by Tier (🥇 T1 < 🥈 T2 < 🥉 T3), R:R ratio, and ATM strike proximity. Stages ONLY the single winning setup per symbol."
    layer_3_mutual_exclusivity:
      rule: "Symbol & Portfolio Mutual Exclusivity Lock"
      mechanics: "If an active CE position exists on a symbol (e.g. LT 4100 CE), opposing PE setups are automatically suppressed with audit logs until the active trade exits."
  modes:
    mode_1_conflict_arbiter_default: "strict_macro_gate: false — Spot 13 EMA serves as a tie-breaker when dual CE/PE form. If only one side forms at a bottom/top reversal, it is permitted and scored by Tier & R:R."
    mode_2_strict_hard_gate: "strict_macro_gate: true — Strictly rejects any setup that is counter to the Spot 13 EMA trend, even if no opposing trade exists."

system_integrity_safeguards:
