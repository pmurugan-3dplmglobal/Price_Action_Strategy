directional_hegemony_and_arbitrage:
  description: "3-Layer Directional Hegemony & Mutual Exclusivity Engine eliminating opposing CE/PE conflicts on the same symbol"
  layers:
    layer_1_spot_macro_trend:
      rule: "Underlying Spot 13 EMA Trend Filter"
      mechanics: "Spot >= 13 EMA -> Macro Bias BULL (Favor CE). Spot < 13 EMA -> Macro Bias BEAR (Favor PE)."
    layer_2_conviction_arbitrage:
      rule: "Single-Setup Dominant Conviction Arbitrage"
      mechanics: "Ranks matching candidates by Moneyness, Tier (🥇 T1 < 🥈 T2 < 🥉 T3), R:R ratio, and ATM proximity. Stages ONLY the single winning setup per symbol."
    layer_3_mutual_exclusivity:
      rule: "Symbol & Portfolio Mutual Exclusivity Lock"
      mechanics: "If an active position exists on a symbol, opposing setups are suppressed until active trade exits."
  modes:
    mode_1_conflict_arbiter_default: "strict_macro_gate: false — Spot 13 EMA serves as tie-breaker when dual CE/PE form. If only one side forms, permitted and scored."
    mode_2_strict_hard_gate: "strict_macro_gate: true — Strictly rejects any setup counter to Spot 13 EMA trend."

system_integrity_safeguards:
  broker_live_reconciliation: "reconcile_broker_live_positions(kite) continuously cross-verifies DB ACTIVE rows against Kite live net held positions. If net quantity <= 0, automatically completes orphan trades."
  rate_limit_protection: "TokenBucketRateLimiter(rate=2.8, capacity=3.0) gates all historical candle and quote requests across multi-threaded 210+ F&O universe scans, preventing HTTP 429 errors."
  market_close_cutoff: "is_new_entry_allowed(live_execution_active) restricts new trade entries to 09:15–15:20 IST only when Live Trading is ON. Post-market scanning and trade staging remain active for research."
  trailing_sl_ratchet: "Monotonic side-aware SL ratchet: new_sl = max(curr_sl, target_base) for BULL and min(curr_sl, target_base) for BEAR, preventing backward SL regression."
  websocket_live_ticks: "ActivePositionWebSocketMonitor provides real-time streaming tick LTP feeds for active position trailing and stop-loss triggers, with transparent fallback to REST quotes."
  spot_token_auto_healing: "Automatic dynamic token auto-repair: queries NSE:<SYMBOL> live quote by symbol name if a token error occurs, self-healing STOCK_REGISTRY in memory on the fly."
  fno_universe_auto_population: "_populate_stock_registry_from_cache() auto-populates all 210+ F&O equities into STOCK_REGISTRY on startup directly from nfo_instruments_cache.csv with exact lot sizes, strikes, and tokens."
  dynamic_position_recovery: "stock_options_trade_engine.py and app_option_Trade.py resolve underlying symbols and lot sizes via extract_underlying_symbol() and get_option_lot_size(), ensuring 100% of live Zerodha F&O positions are recovered and monitored."
  direct_ltp_sl_fallback: "Emergency capital protection shield: If historical candle token resolution fails, app_option_Trade falls back immediately to DIRECT_LTP_SL_FALLBACK on buffer breach without waiting for candle confirmation."
  breakeven_trailing_shield: "Positive Breakeven (+BE: Entry + 2% for Bull, Entry - 2% for Bear, snapped to 0.05 tick) locks profit upon reaching +10% peak gain or touching T1, preventing winning trades from slipping into losses."
  spot_anchored_sl_guard: "Spot-Anchored SL Guard (enable_spot_sl_guard: true): For option contracts, queries live Cash Spot price against the structural anchor support floor (spot_sl) before tripping stop-loss. Prevents IV crush and spread wick shakeouts while Spot is holding support, backed by a 35% catastrophic option circuit cap."
  two_tranche_profit_model: "2-Tranche Core + Runner Profit Booking (tranche_mode: true): Multi-lot positions (>= 2 lots) execute 50% partial cash exit at Target 1 (T1) and raise remaining runner SL to Breakeven. Single-lot positions (1 lot) ratchet SL to Breakeven at T1 to create a zero-risk runner riding to T2 and T3."
  datta_d2_reentry_engine: "Datta D2 Trend Continuation Re-Entry Engine (scan_trend_continuation_reentry): Wired into Stock and Index Option trade engines to scan post-Point-B flag pullbacks and automatically trigger secondary continuation breakouts."
  broker_product_authority: "Live Broker Product Authority: close_position() queries live kite.positions() dynamically to match the exact open product type (NRML or MIS), eliminating Zerodha RMS naked writing margin rejections."
  cross_strike_contract_isolation: "Strict Contract Isolation (_is_match): Dashboard /api/update-position endpoints strictly match by full contract identifier, preventing cross-strike SL override collisions."
  cloud_vm_deployment_pipeline: "Strict Cloud Deployment Rule: NEVER modify code directly on remote VMs. Mandatory pipeline: 1. Local Development -> 2. Regression Suite (100% Pass) -> 3. Git Push -> 4. VM Git Pull & Service Restart. Credentials isolated per environment."
  utc_cloud_ist_clock_normalization: "UTC Cloud IST Clock Normalization: All time-of-day conditionals, opening volatility guards (09:45 AM failsafe), EOD squareoffs, and export schedules use get_ist_now() to guarantee flawless execution regardless of whether host OS runs in UTC, GMT, or IST."
  timeframe_adaptive_liquidity_shield: "is_liquid_cash_stock(df, timeframe) scales 20-period volume by candles_per_day, enabling liquid midcaps (DIXON, POLYCAB, BHARATFORG) to pass across intraday timeframes (15m, 30m, 1hr) while filtering illiquid penny trap stocks."
  point_d_entry_time_alignment: "Separates Point D Breakout entry_time from Point A Anchor candle_a_time in stock and option scanners, presenting clean calendar dates for Daily/Weekly candles without artificial 09:15 overrides."
  option_vwap_guard: "Option Contract VWAP +2σ Overpay Guard (calculate_option_vwap): Computes intraday Volume-Weighted Average Price and Volume-Weighted Standard Deviation bands: TypicalPrice = (H+L+C)/3, VWAP = sum(TP*V)/sum(V), vwap_std = sqrt(sum(V*(TP-VWAP)^2)/sum(V)), z_score = (LTP-VWAP)/vwap_std, upper_2sigma = VWAP + 2*vwap_std, stretch_pct = ((LTP-VWAP)/VWAP)*100. Classification: FAIR (z <= 1.0 and stretch <= 8.0%, +2 rank bonus), EXPANDED (z 1.0-2.0 or stretch 8-15%, 0 neutral), STRETCHED (z > 2.0 or stretch > 15.0%, -2 rank penalty). Guards against retail FOMO / market maker spread gouging without starving trades."
  spot_confluence_mapping: "D1/D2 Regime-Aware Spot Confluence Mapping (evaluate_spot_confluence): Resolves 'Option Chart Illusion' by mapping option timeframe to higher-timeframe spot (3m/5m opt -> 15m spot, 15m opt -> 60m spot, 30m opt -> daily spot). D1 Reversals verify Spot Intraday VWAP reclaim (SPOT_VWAP_RECLAIM: spot >= vwap for CE, <= vwap for PE), structural anchor support/resistance hold (SPOT_SUPPORT_HOLD / SPOT_RESISTANCE_HOLD: spot >= sl for CE, <= sl for PE), or early EMA recovery (SPOT_EMA_TREND); confirmed D1 setups with R:R >= 2.0 receive D1 Gold Tier Promotion (🥇 T1 Gold). D2 Continuations require established trend momentum (TREND_MOMENTUM_ALIGNMENT: spot >= EMA13/44 for CE, <= EMA13/44 for PE) and Spot VWAP consistency. Confirmed confluence grants +1.0 rank bonus."
  vcp_metrics_engine: "Volatility Contraction Pattern (VCP) Metrics (calculate_vcp_metrics): Quantifies volatility compression before breakout: Contraction Ratio = ATR(3) / ATR(14) (ratio <= 0.60 indicates >= 40% compression vs baseline); TTM Squeeze evaluates Bollinger Bands (20 period, 2.0 std dev) strictly inside Keltner Channels (20 period EMA + 1.5 ATR20). Classification: ULTRA_SQUEEZE (squeeze and ratio <= 0.60, 🔥 ULTRA SQZ {ratio}), SQUEEZE (squeeze, 🔥 SQZ {ratio}), VCP_COILED (ratio <= 0.60, ⚡ VCP {ratio}), NORMAL. Integrated into pattern detectors and grants ranking bonuses (+0.50 squeeze, +0.30 ATR compression)."
  twap_c_absorption_stability: "Point C TWAP Stability (calculate_twap_c_stability): Evaluates Point C absorption base tightness during flag consolidation via Time-Weighted Average Price standard deviation: twap_std = std(c_closes), twap_c_ratio = twap_std / max(0.50, risk_dist). Stable if twap_c_ratio <= 0.25; twap_score = max(0.0, 1.0 - min(1.0, twap_c_ratio)). Pristine bases receive +1.0 ranking bonus and qualify setups for Tier 1 Gold / STAGE_A_PLUS_READY."
  stock_options_parity: "Option vs Stock Domain Parity Alignment: Options operate under the Long Option Buyer invariant (both CE and PE contracts are bought long via TRANSACTION_TYPE_BUY, profit on premium rise, and exit via SELL). Cash Equities support Long Equity (BUY CNC/MIS, profit on rise, exit via SELL) and Short Cash Equity (SELL MIS, profit on price drop, exit via BUY MIS at ask * 1.005 to cover). Risk monitor evaluates short stock exits on lp <= (target + buf), trails +BE down to entry * 0.98, sets SL above entry, and computes short PnL = ((entry - exit) / entry * 100). derive_sl_targets_for_contract(symbol, entry, side) sets bearish SL above entry and targets below entry. UI displays red SHORT (MIS) button and arrowDown markers."
  is_option_contract_resolution: "Robust Option Contract Identification: Evaluates (c.endswith('CE') or c.endswith('PE')) and any(ch.isdigit() for ch in c). Strictly separates true option contracts (e.g. NIFTY24SEP25000CE, INFY24SEP1500PE) from cash equities with substring or suffix collisions (e.g. PETRONET, PEL, PERSISTENT, CENTRALBK, HDFCBANK), preventing false NFO routing and inverted SL derivation."
  continuous_15pct_loss_shield: "Continuous 15% Greek Loss Shield: Exempts HARD_MAX_15PCT_SL and morning catastrophic circuits from Spot SL Guard suppression, aligning emergency cutoff strictly to max_loss_pct (15%)."

