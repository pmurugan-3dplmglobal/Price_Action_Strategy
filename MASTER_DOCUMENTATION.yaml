scan_display_anchor_fields:
  description: "Engine-persisted anchor fields on every staged trade / position so the chart modal mirrors the engine's confirmed setup exactly"
  benchmark: "Breakout threshold = A.high for CE/BULL, A.low for PE/BEAR. Chart Entry price line draws here (label 'Entry (A.high)' / 'Entry (A.low)')."
  anchor_floor: "Sequence-integrity floor = A.low for BULL, A.high for BEAR. Breach triggers chart 'Seq broken' marker."
  direction: "\"BULL\" or \"BEAR\". Drives direction-aware A-B-C-D marker detection (BEAR: B = Close < A.low, C = retest holding below A.high, D = red Close < A.low)."
  flow: "scan_anchor_bcd_breakout / _bearish -> scan_symbol -> write_scan_display_data.build_trade -> staged JSON -> dashboard chart modal."
  chart_risk_math: "SL% / T1 RR / footer R:R computed against the benchmark (not actual entry) for strategy-consistent risk math."
  golden_rule: "UI MUST NOT re-derive A.high/A.low from candle_a_time. The engine's persisted benchmark is the single source of truth."

sl_buffer_scaling:
  description: "Dynamic asset & price-tiered Stop Loss buffer (calculate_sl_buffer) providing robust breathing room across option and equity price tiers"
