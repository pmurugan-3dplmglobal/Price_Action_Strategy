directional_hegemony_and_arbitrage:
  description: "3-Layer Directional Hegemony & Mutual Exclusivity Engine eliminating opposing CE/PE conflicts on the same symbol"
  layers:
    layer_1_spot_macro_trend:
      rule: "Underlying Spot 13 EMA Trend Filter"
      mechanics: "Calculates 13 EMA on Spot candles. If Spot >= 13 EMA -> Macro Bias is BULL (Favor CE). If Spot < 13 EMA -> Macro Bias is BEAR (Favor PE)."
    layer_2_conviction_arbitrage:
      rule: "Single-Setup Dominant Conviction Arbitrage"
      mechanics: "Collects all matching strike candidates for a symbol, filters by Spot Macro Bias, and ranks by Tier (🥇 T1 < 🥈 T2 < 🥉 T3), R:R ratio, and ATM strike proximity. Stages ONLY the single winning setup per symbol."
    layer_3_mutual_exclusivity:
      rule: "Symbol & Portfolio Mutual Exclusivity Lock"
      mechanics: "If an active CE position exists on a symbol (e.g. LT 4100 CE), opposing PE setups are automatically suppressed with audit logs until the active trade exits."
  modes:
    mode_1_conflict_arbiter_default: "strict_macro_gate: false — Spot 13 EMA serves as a tie-breaker when dual CE/PE form. If only one side forms at a bottom/top reversal, it is permitted and scored by Tier & R:R."
    mode_2_strict_hard_gate: "strict_macro_gate: true — Strictly rejects any setup that is counter to the Spot 13 EMA trend, even if no opposing trade exists."

system_integrity_safeguards:
  broker_live_reconciliation: "reconcile_broker_live_positions(kite) continuously cross-verifies DB ACTIVE rows against Kite live net/day held positions. If net quantity <= 0, automatically completes and purges orphan trades."
  rate_limit_protection: "TokenBucketRateLimiter(rate=2.8, capacity=3.0) gates all historical candle and quote requests across multi-threaded 208+ F&O universe scans, preventing HTTP 429 errors."
  market_close_cutoff: "is_new_entry_allowed(live_execution_active) restricts new trade entries to 09:15–15:20 IST only when Live Trading is ON. When Live Trading is OFF (or post-market), scanning and trade staging remain active for research & study."
  trailing_sl_ratchet: "Monotonic side-aware SL ratchet: new_sl = max(curr_sl, target_base) for BULL and min(curr_sl, target_base) for BEAR, preventing backward SL regression."
  websocket_live_ticks: "ActivePositionWebSocketMonitor provides real-time streaming tick LTP feeds with sub-millisecond latency for active position trailing and stop-loss triggers, with transparent fallback to REST quotes."
  spot_token_auto_healing: "Automatic dynamic token auto-repair: queries NSE:<SYMBOL> live quote by symbol name if a token error occurs, self-healing STOCK_REGISTRY in memory on the fly."
  fno_universe_auto_population: "_populate_stock_registry_from_cache() auto-populates all 209+ F&O equities into STOCK_REGISTRY on startup directly from nfo_instruments_cache.csv with exact lot sizes, strikes, and tokens, eliminating static 52-stock whitelist drops."
  dynamic_position_recovery: "stock_options_trade_engine.py and app_option_Trade.py resolve underlying symbols and lot sizes via extract_underlying_symbol() and get_option_lot_size(), ensuring 100% of live Zerodha F&O positions are recovered and monitored."
  direct_ltp_sl_fallback: "Emergency capital protection shield: If historical candle token resolution fails, app_option_Trade falls back immediately to DIRECT_LTP_SL_FALLBACK on buffer breach without waiting for candle confirmation."
  breakeven_trailing_shield: "Stage 1 Breakeven Trailing Stop-Loss automatically moves SL to Entry price as soon as a trade achieves >= +10.0% peak gain or touches T1, preventing profitable momentum from turning into stop-loss hits."
  spot_anchored_sl_guard: "Spot-Anchored SL Guard (enable_spot_sl_guard: true): For option contracts, queries live Cash Spot price against the structural anchor support floor (spot_sl) before tripping stop-loss. Prevents IV crush and spread wick shakeouts while Spot is holding support, backed by a 35% catastrophic option circuit cap."
  two_tranche_profit_model: "2-Tranche Core + Runner Profit Booking (tranche_mode: true): Multi-lot positions (>= 2 lots) execute 50% partial cash exit at Target 1 (T1) and raise remaining runner SL to Breakeven. Single-lot positions (1 lot) ratchet SL to Breakeven at T1 to create a zero-risk runner riding to T2 and T3."
  datta_d2_reentry_engine: "Datta D2 Trend Continuation Re-Entry Engine (scan_trend_continuation_reentry): Wired into Stock and Index Option trade engines to scan post-Point-B flag pullbacks and automatically trigger secondary continuation breakouts."
  broker_product_authority: "Live Broker Product Authority: close_position() queries live kite.positions() dynamically to match the exact open product type (NRML or MIS), completely eliminating Zerodha RMS naked writing margin rejections."
  cross_strike_contract_isolation: "Strict Contract Isolation (_is_match): Dashboard /api/update-position endpoints strictly match by full contract identifier, preventing cross-strike SL override collisions across multi-strike option holdings."
  cloud_vm_deployment_pipeline: "Strict Cloud Deployment Rule: NEVER modify code directly on remote VMs. Mandatory pipeline: 1. Local Development -> 2. 17-Test Regression Suite (100% Pass) -> 3. Git Push -> 4. VM Git Pull & Service Restart. Machine credentials remain isolated per environment."
  utc_cloud_ist_clock_normalization: "UTC Cloud IST Clock Normalization: All time-of-day conditionals, opening volatility guards (09:45 AM failsafe), EOD squareoffs, and export schedules use get_ist_now() to guarantee flawless execution regardless of whether the host OS runs in UTC, GMT, or IST."
  timeframe_adaptive_liquidity_shield: "is_liquid_cash_stock(df, timeframe) scales 20-period volume by candles_per_day, enabling liquid midcaps (DIXON, POLYCAB, BHARATFORG) to pass across intraday timeframes (15m, 30m, 1hr) while filtering illiquid penny trap stocks."
  point_d_entry_time_alignment: "Separates Point D Breakout entry_time from Point A Anchor candle_a_time in stock and option scanners, presenting clean calendar dates for Daily/Weekly candles without artificial 09:15 overrides."
  option_vwap_guard: "Intraday Option Contract VWAP: calculate_option_vwap() computes fair value benchmark from traded option premium; grants candidate ranking bonus (+2) for fair pricing (<=8% stretch) and applies penalty (-2) for overstretched contracts (>15%) without hard rejection."
  twap_c_absorption_stability: "Point C TWAP Stability: calculate_twap_c_stability() quantifies absorption base tightness during flag consolidation (std <= 0.25 * risk); elevates pristine accumulation bases to Tier 1 Gold / STAGE_A_PLUS_READY."
  spot_confluence_mapping: "Spot-Relative Confluence Mapping: get_mapped_spot_timeframe() links option entry timeframes to higher-timeframe spot market structure (3m/5m -> 15m, 15m -> 60m, 30m -> daily); 13 EMA alignment grants rank bonus."
  continuous_15pct_loss_shield: "Continuous 15% Greek Loss Shield: Exempts HARD_MAX_15PCT_SL and morning catastrophic circuits from Spot SL Guard suppression, aligning emergency cutoff strictly to max_loss_pct (15%)."

